        - Flodvand kan drikkes, hvis det koges
        blank_lines: 12
      - type: places
        title: Steder
        items:
        - 'Nord for floden: <i>Den levende skov</i> (rent hjerte)'
        - Nordlandet (kræver Ashes medaljon)
        blank_lines: 8
      - type: people
        title: Personer og væsner
        items:
        - Loft · kobold · corgi · taler langsomt
        blank_lines: 13
  footer: Valak · Udstyr

