    subtitle: Udstyr
    summary:
    - [Opdateres, Løbende i spillet]
  layout:
  - columns:
    - width: 1
      content:
      - type: weapons
        title: Våben <i>Weapons</i>
        items:
        - Stav <i>Quarterstaff</i> · 1d6 Bludgeoning, 1d8 tohånds
        - Orksværd <i>Hjemmelavet</i> · 1d8 Slashing · ikke trænet
        - Kniv <i>Dagger</i> · 1d4 Piercing · kan kastes 20/60 ft
        blank_lines: 2
      - type: gear
