        - Sovegrej <i>Bedroll</i>
        - Førstehjælp <i>Healer's Kit</i> · stabiliserer uden slag [][][][][][][][][][]
        - Gyldne æbler <i>Hjemmelavet</i> · healing ved kort hvil [][][]
        - Rationer <i>Rations</i> [][][]
        - Skyggebog <i>Book of Shadows</i>
        blank_lines: 14
      - type: special
