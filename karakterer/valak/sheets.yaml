# Konverteret fra valaks gamle karakter.yaml (sider:). Layout og fritekst er håndholdt;
# tal der kan udledes (evner, saves, skills, passive sanser) kommer fra character.yaml.
pages:

# ── Side 1 · Karakterark ─────────────────────────────────────────────────────────
- margin: small
  top:
    extra_summary:
    - [Pagt, Enhjørning <i>Hjemmelavet</i>]
  layout:
  - type: stats
    # fields overstyrer: AC kommer fra Armor of Shadows (Mage Armor, 13 + DEX), og HP vises som interval,
    # fordi hp_rolls i choices.yaml ikke er slået (spilleren slår/tager gennemsnit i spillet).
    fields:
    - [<em>AC</em> · Armor of Shadows, '{13+DEX}']
    - [Max HP, 13–20, 8+CON + 1d8+CON]
    - [<em>Hit Dice</em>, 2d8, 1 d8 pr. level]
    - [Initiativ, '{+DEX}']
    - [Fart · <em>Speed</em>, '30', 'Dash: 60']
    - [<em>Prof. bonus</em>, '{+PB}', level 1–4]
    - [Passiv <em>Perc.</em>, '{10+WIS}']
    - [Spell DC, '{8+CHA+PB}']
  - columns:
    - width: 52
      content:
      - type: abilities
      - type: passive
        title: Passive sanser
      - type: languages
        title: Sprog <em>Languages</em>
        # text overstyrer: Abyssal og Sylvan er ikke i 2024's Standard Languages-tabel, så byggeren kan ikke vælge dem.
        text: Common, Abyssal <em>(dæmon)</em>, Orc, Sylvan <em>(ent)</em>
    - width: 140
      content:
      - type: attacks
        title: Angreb <em>· Attacks</em>
        attacks:
        - [Kniv <em>Dagger</em>, '{+DEX+PB}', '1d4{+DEX} Piercing', kast 20/60 ft]
        - [Stav <em>Quarterstaff</em>, '{+STR+PB}', '1d6{+STR} Bludgeoning', 1d8 med to hænder]
        - [Orksværd <em>Hjemmelavet</em>, '{+STR}', '1d8{+STR} Slashing', ikke trænet]
        - [Overjordisk stråle <em>Eldritch Blast</em>, '{+CHA+PB}', '1d10{+CHA} Force', 120 ft · Agonizing Blast]
        - [Ildpil <em>Fire Bolt</em>, '{+CHA+PB}', 1d10 Fire, 120 ft]
        - [Elektrisk greb <em>Shocking Grasp</em>, '{+CHA+PB}', 1d8 Lightning, berøring · målet får ingen reaction]
        - [Giftsprøjt <em>Poison Spray</em>, '{+CHA+PB}', 1d12 Poison, 30 ft]
      - type: magic
        dc:
        - name: Al magi · CHA
          roll: '{+CHA+PB}'
          dc: '{8+CHA+PB}'
        slots: <b>Spell slots</b> 1. grad [][] · kommer igen ved kort hvil
        lists:
        - - Cantrips
          - Eldritch Blast · Minor Illusion · Fire Bolt · Shocking Grasp · Shape Water · Poison Spray · Thaumaturgy · Guidance · Spare the Dying
        - - 1. grad
          - <b>Hex</b> · <b>Armor of Agathys</b> 5 midl. HP, 5 Cold til den, der rammer · <b>Witch Bolt</b> 2d12 Lightning, så 1d12/tur (konc.)
        - - 1. grad · Cleric
          - '<b>Cure Wounds</b> 2d8{+CHA} HP · gratis 1× pr. lang hvil []'
        - - Ritualer
          - Detect Magic · Comprehend Languages
      - columns:
        - width: 1
          content:
          - type: features
            title: Evner &amp; træk <em>· Features</em>
            items:
            - name: Mørkesyn <em>Darkvision</em>
              text: 60 ft. Mørke ses som svagt lys, kun i gråtoner.
            - name: Modstand mod gift
              text: Halv skade fra gift (Poison).
            - name: Pagtmagi <em>Pact Magic</em>
              text: Spell slots kommer igen ved kort hvil.
            - name: Magical Cunning []
              tag: 1× Long Rest
              text: 1 minuts meditation giver halvdelen af dine spell slots igen (rund op).
            - name: Pact of the Tome
              text: Skyggebog med 3 ekstra cantrips og 2 ritualer.
            - name: Agonizing Blast
              text: Læg CHA til skaden fra Eldritch Blast.
            - name: Armor of Shadows
              text: Mage Armor på dig selv når som helst, uden slot (AC 13 + DEX).
        - width: 1
          content:
          - type: bonus_actions
            title: Bonus actions
            items:
            - name: Hex <em>1. grad</em>
              text: Bonus Action, koncentration. +1d6 Necrotic-skade, hver gang du rammer målet. Ulempe for målet på checks med én evne, du vælger.
  footer: D&amp;D 2024 · PHB 2024 kap. 3 (Warlock), kap. 4 (Tiefling, Acolyte) og kap. 7 (besværgelser).

# ── Side 2 · Handlinger ──────────────────────────────────────────────────────────
- margin: small
  box_type: none
  top:
    subtitle: Hvad kan jeg gøre?
    summary:
    - [Slag, d20 + tallet]
    - [Fordel, "2 d20, tag højeste"]
    - [Ulempe, "2 d20, tag laveste"]
  layout:
  - type: actions
    bonus: {}
  - columns:
    - width: 1
      merged: tight
      content:
      - type: unarmed
      - type: movement
      - type: extra
        title: Tiefling og magi
        items:
        - '<b>Mørkesyn</b> 60 ft. <b>Modstand mod gift</b>: halv Poison-skade.'
        - '<b>Koncentration</b>: tager du skade, slår du CON-save mod DC 10 eller halvdelen af skaden (det højeste), ellers slutter besværgelsen.'
      - type: death_saves
      - type: mastery
      - type: useful
    - width: 1.25
      merged: tight
      content:
      - type: skill_checks
        tools:
        - {name: "Calligrapher's Supplies", ability: DEX, use: 'Skrive, kopiere, forfalske skrift'}
      - type: conditions
  footer: "Valak · Handlinger og slag · Kilde: Player's Handbook 2024 · kap. 1 (handlinger), kap. 6 (Weapon Mastery) og Rules Glossary"

# ── Side 3 · Udstyr ──────────────────────────────────────────────────────────────
- margin: small
