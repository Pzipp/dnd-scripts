        - Metalkugler <i>Ball Bearings</i> (1.000)
        - Olie <i>Oil</i> [][][][][][][][]
        - Fakler <i>Torch</i> [][][][][][][][][][]
        - Lys <i>Candle</i> [][][][][][][][][][]
        - Rationer <i>Rations</i> [][][][][][][][][][][][][][][]
        tomme: 6
      - type: sarlige
        titel: Særlige genstande
        punkter:
        - <b>Morrens Favn</b> <i>Hjemmelavet</i> · amulet af messing- og sølvtråd med knust glas. „Så længe du bærer den, finder natten dig ikke først.“
        tomme: 3
      - type: penge
        titel: Penge <i>Coins</i>
        form: penge

    - bredde: 1
      indhold:
      - type: kampagne
        titel: Kampagne og mission
        punkter: []
