# Dev One karakterark (D&D 2024).
# Felt-reference: docs/karakterark-yaml.md · kommenteret skabelon: karakterer/_skabelon/karakter.yaml
# Lav ark:  python3 dnd.py karakterark dev-one

# Titel på HTML/PDF-filen.
titel: Dev One karakterark

# ── Fælles felter: gælder hele karakteren ──
faelles:
  navn: Dev One
  ident:
  - [Klasse, Rogue 2]
  - [Art, Halfling <i>(Small)</i>]
  - [Baggrund, Criminal]
  - [Spiller, Sebastian]
  pb: 2
  fart: 30
  hit_die: 8
  saves: [DEX, INT]
  skills: [Deception, Insight, Investigation, Sleight of Hand]
  expertise: [Stealth, Perception]
  vaerktoej:
    DEX: [Thieves' Tools]
    INT: [Alchemist's Supplies]
  sprog: Common, Dwarvish, Halfling, Orc, <em>Thieves' Cant</em>
  kan_bruge:
    Rustning: Light armor
    Våben: Simple + Martial med <i>Finesse</i> eller <i>Light</i>
    Værktøj: Thieves' Tools · Alchemist's Supplies
  masteries:
  - [Vex, Shortsword]
  - [Nick, Dagger]
  feats: [Alert (fra Criminal)]

# ── Side 1 · Karakterark: én side pr. version ──
karakterark:
  evner: {STR: 14, DEX: 18, CON: 12, INT: 14, WIS: 13, CHA: 9}
  stats:
  - [<em>AC</em> · Leather, '{11+DEX}']
  - [Max HP, '15', 8+CON + 5+CON]
  - [<em>Hit Dice</em>, 2d8, 1 d8 pr. level]
  - [Initiativ, '{+DEX+PB}', d20 + DEX + PB (Alert)]
  - [Fart · <em>Speed</em>, '30', 'Dash: 60']
  - [<em>Prof. bonus</em>, '{+PB}', level 1–4]
  - [Passiv <em>Perc.</em>, '{10+WIS+2*PB}']
  - [<em>Sneak Attack</em>, 1d6, Rogue lvl 1–2]

  # Layout: rækker stables lodret, kolonner står side om side.
  # Hver boks har en type, som generatoren bruger som CSS-klasse.
  layout:
  - kolonner:

    - bredde: 0.7
      indhold:
      - type: evner
        titel: Evner
      - type: passiv
        titel: Passive sanser
        punkter:
        - [Perception, '{10+WIS+2*PB}']
        - [Insight, '{10+WIS+PB}']
        - [Investigation, '{10+INT+PB}']
      - type: sprog
        titel: Sprog
        tekst: Common, Dwarvish, Halfling, Orc, <em>Thieves' Cant</em>

    - bredde: 2
      indhold:
      - type: angreb
        titel: Angreb <em>· Attacks</em>
        angreb:
        - [Kortsværd <em>Shortsword</em>, '{+DEX+PB}', '1d6{+DEX} Piercing', '<b>Vex</b> · Finesse, Light']
        - [Dolk <em>Dagger</em>, '{+DEX+PB}', '1d4{+DEX} Piercing', <b>Nick</b> · kast 20/60 ft]
        - [Dolk (ekstra) <em>Dagger</em>, '{+DEX+PB}', 1d4 Piercing, 'Light-ekstraangreb: ingen DEX til skaden']
        - - Let armbrøst <em>Light Crossbow</em>
          - '{+DEX+PB}'
          - 1d8{+DEX} Piercing
          - 80/320 ft · <em>Loading</em>, to hænder · 20 bolts
        - [Blæserør <em>Blowgun</em>, '{+DEX}', '{1+DEX} Piercing', 25/100 ft · ikke trænet · 50 nåle]
        - [Ubevæbnet <em>Unarmed Strike</em>, '{+STR+PB}', '{1+STR} Bludgeoning', '']

      - type: regler
        titel: Snigangreb
        undertitel: Sneak Attack +1d6, én gang pr. tur
        punkter:
        - Kræver <em>Finesse</em>- eller afstandsvåben (alle dine våben undtagen ubevæbnet).
        - Og <b>enten</b> <em>Advantage</em> på angrebet, <b>eller</b> en allieret inden for 5 ft af målet (ikke <em>Incapacitated</em>), og du har ikke <em>Disadvantage</em>.
        - Kan bruges på et af de to nærkampsangreb. Ram med det første, så du ikke spilder chancen.

      - kolonner:

        - bredde: 1
          indhold:
          - type: traek
            titel: Evner &amp; træk <em>· Features</em>
            punkter:
            - navn: Held <em>Luck</em>
              tag: Passiv
              tekst: 'Slår du 1 på en d20 (angreb, save, check): slå om, du skal bruge det nye slag.'
            - navn: Modig <em>Brave</em>
              tekst: <em>Advantage</em> på saves mod at blive / slippe fri af <em>Frightened</em>.
            - navn: Halfling-smidighed <em>Nimbleness</em>
              tekst: Gå gennem pladsen af en større skabning, men ikke stoppe der.
            - navn: Naturligt snigende
              tekst: Må <em>Hide</em>, når du kun er skjult bag en større skabning.
            - navn: Alert
              tag: Feat
              tekst: +PB på initiativ (allerede regnet med). Lige efter initiativ må du <b>bytte</b> initiativ med en villig allieret.
            - {navn: Thieves' Cant, tekst: Tyvenes hemmelige sprog og tegn.}

        - bredde: 1
          indhold:
          - type: bonus
            titel: Bonus actions
            punkter:
            - navn: Cunning Action
              tekst: <em>Dash</em> (60 ft i alt), <em>Disengage</em> eller <em>Hide</em>.
            - navn: Hide
              tekst: 'Stealth {+DEX+2*PB} mod DC 15. Kræver <em>Heavily Obscured</em> eller ¾ dækning – eller bare en større allieret (<em>Naturligt snigende</em>). Lykkes det: <em>Invisible</em> → fordel → Sneak Attack.'
          - type: tur
            undertitel: nærkamp
            titel: Sværd + dolk
            punkter:
            - '<b>Attack</b>: Shortsword. Rammer du → <b>Vex</b> giver <em>Advantage</em> på næste angreb mod samme mål.'
            - 'Samme <b>Attack</b>-handling: dolk-ekstraangreb via <b>Nick</b> (bruger ikke din <em>Bonus Action</em>).'
            - '<b>Bonus Action</b>: <em>Disengage</em> og gå væk, eller <em>Hide</em>.'
          - type: tur
            undertitel: afstand
            titel: Skjul og skyd
            punkter:
            - '<b>Bonus Action</b>: <em>Hide</em> bag en Medium allieret.'
            - Lykkes det → <em>Invisible</em> → <em>Advantage</em> → <b>Sneak Attack</b>.
            - '<b>Attack</b>: Light Crossbow, 1d8{+DEX} + 1d6.'

  fod: 'D&amp;D 2024 · PHB 2024 s. 129–130 (Rogue), 193 (Halfling), 200 (Alert). Light-reglen: ekstraangrebet skal være med et <b>andet</b> Light-våben.'

# ── Side 2 · Handlingsark ──
handlingsark:
  # Handlingstabellen øverst er fast. bonus_handlinger kobler Bonus Action-tags på tabellen.
  bonus_handlinger: {Dash: Cunning Action, Disengage: Cunning Action, Hide: Cunning Action}
  layout:
  - kolonner:

    - bredde: 1
      indhold:
      - type: ubevaebnet
      - type: bevaegelse
      - type: ekstra
        titel: Halfling
        punkter:
        - '<b>Naturligt snigende</b>: du må gemme dig, når du kun er dækket af en skabning, der er mindst én størrelse større end dig.'
        - '<b>Smidighed</b>: du kan bevæge dig gennem en større skabnings felt, men ikke stoppe der.'
        - '<b>Held</b>: slår du 1 på en d20, slår du om og bruger det nye.'
      - type: livsredning
      - type: mastery
      - type: nyttige

    - bredde: 1.25
      indhold:
      - type: situationer
        vaerktoej:
        - {navn: Thieves' Tools, evne: DEX, brug: 'Dirke en lås, desarmere en fælde'}
        - {navn: Alchemist's Supplies, evne: INT, brug: 'Blande, analysere stoffer'}
      - type: tilstande

