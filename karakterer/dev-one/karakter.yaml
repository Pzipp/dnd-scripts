        - Kortsværd <i>Shortsword</i> · 1d6 Piercing · <i>Vex</i>
        - Dolk ×5 <i>Dagger</i> · 1d4 Piercing · kast 20/60 ft · <i>Nick</i>
        - Let armbrøst <i>Light Crossbow</i> · 1d8 Piercing · 80/320 ft
        - Bolts [][][][][] [][][][][] [][][][][] [][][][][]
        - Blæserør <i>Blowgun</i> · 50 nåle
