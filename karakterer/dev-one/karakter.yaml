# ── Side 4 · Baggrundsark ──
baggrundsark:
  ident:
  - [Art, Halfling]
  - [Baggrund, Criminal]
  - [Holdning, Neutral]
  layout:
  - kolonner:

    - bredde: 1
      indhold:
      - type: udseende
        titel: Udseende <i>Appearance</i>
        form: fakta
        felter:
        - [Alder, '']
        - [Højde, '']
        - [Vægt, '']
        - [Øjne, '']
        - [Hår, '']
        - [Hud, '']
      - type: kendetegn
        titel: Kendetegn
        punkter: [Hænderne er altid i gang.]
        tomme: 3
      - type: historie
        titel: Historie <i>Backstory</i>
        form: tekst
        afsnit:
        - Voksede op hos sin mor <b>Elira</b>, der var alkymist.
        - Har en lillesøster, <b>Talla</b>, som han ikke har set siden.
        tomme: 6
      - type: traening
        titel: Træning og valg <i>Proficiencies</i>
        form: traening

    - bredde: 1
      indhold:
      - type: personlighed
        titel: Personlighed
        punkter:
        - '<b>Træk</b>: roligt ydre, men hurtigt temperament, når nogen udnytter ham.'
        - '<b>Idealer</b>: overlevelse og frihed. Ingen skal have magt over hans liv.'
        - '<b>Bånd</b>: minderne om moren Elira og hendes alkymi · lillesøsteren Talla.'
        - '<b>Brister</b>: ser vold som en praktisk løsning · forventer altid forræderi · tager den nemmeste vej, også når den er blodig.'
      - type: familie
        titel: Familie og venner
        punkter: [<b>Elira</b> · mor · alkymist, <b>Talla</b> · lillesøster]
        tomme: 6
      - type: fjender
        titel: Fjender og rivaler
        punkter: []
        tomme: 6
      - type: maal
        titel: Mål og drømme
        punkter: []
        tomme: 6
      - type: hemmeligheder
        titel: Hemmeligheder
        punkter: []
        tomme: 6
