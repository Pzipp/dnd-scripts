        - '<b>Flurry of Blows</b> (1 FP): efter Attack-handlingen to Unarmed Strikes som Bonus Action. Level 10: tre.'
        - '<b>Patient Defense</b> (1 FP): Dodge som Bonus Action.'
        - '<b>Step of the Wind</b> (1 FP): Dash eller Disengage som Bonus Action.'
        - '<b>Stunning Strike</b> (1 FP): se kort.'
