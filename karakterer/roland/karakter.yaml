      - kolonner:
        - bredde: 1
          indhold:
          - type: traek
            titel: Evner &amp; træk <em>· Features</em>
            punkter:
            - navn: Martial Arts
              tag: Monk
              tekst: 'Unarmed Strike og Monk-våben: Martial Arts-terning (d10 på level 11–16). DEX i stedet for STR på angreb og skade.'
            - navn: Unarmored Defense
              tekst: AC = 10 + DEX + WIS, når du ikke bærer rustning eller skjold.
            - navn: Deflect Attacks
              tag: Reaction
              tekst: 'Reducér skade med 1d10 + DEX + Monk-level (level 13: alle skadetyper).'
            - navn: Slow Fall
              tag: Reaction
              tekst: Reducér faldskade med 5 × Monk-level (60 ved level 12).
            - navn: Extra Attack
              tekst: Angrib to gange, når du tager Attack-handlingen.
            - navn: Stunning Strike
              tag: Focus 1
              tekst: 'Ét gang pr. tur ved træf: CON-redningskast mod DC 16. Fejl: Stunned til din næste tur.'
            - navn: Empowered Strikes
              tekst: Unarmed Strikes kan lave Force-skade.
            - navn: Wholeness of Body
              tag: Bonus Action
              tekst: Slå Martial Arts-terningen og heal terningen + WIS-modifier. [][][][] pr. Long Rest.
            - navn: Evasion
              tekst: 'Ved DEX-redning for halv skade: ingen skade ved succes, halv ved fejl.'
            - navn: Stillness of Mind
              tag: Action
              tekst: Afslut én effekt, der gør dig Charmed eller Frightened.
            - navn: Acrobatic Movement
              tekst: Bevæg dig op og ned ad vægge og over væsker, mens du er uden rustning.
            - navn: Heightened Focus
              tekst: Flurry of Blows giver tre slag. Patient Defense giver midlertidige HP. Step of the Wind kan flytte allierede.
            - navn: Self-Restoration
              tag: End of Turn
              tekst: Fjern Charmed, Frightened eller Poisoned fra dig selv ved turens slutning.
            - navn: Tranquility
              tag: Open Hand · 11
              tekst: 'Efter Long Rest: effekten af sanctuary. DC 8 + WIS + PB.'
            - navn: Darkvision
              tag: Dwarf
              tekst: 120 ft.
            - navn: Dwarven Resilience
              tag: Dwarf
              tekst: Resistance mod Poison. Advantage på redninger mod Poisoned.
            - navn: Dwarven Toughness
              tag: Dwarf
              tekst: HP-max +1 pr. level (+12 ved level 12).
            - navn: Stonecunning
              tag: Dwarf · [][][][]
              tekst: 'Bonus Action: Tremorsense 60 ft i 10 min. på sten. PB gange pr. Long Rest.'
            - navn: Healer
              tag: Origin feat
              tekst: 'Utilize Healer''s Kit som handling: én Hit Die + PB healing.'
            - navn: Lucky
              tag: Feat · Long Rest
              tekst: Luck Points = PB (4). Brug én til Advantage på et D20 Test.
        - bredde: 1
          indhold:
          - type: bonus
            titel: Bonus actions
            punkter:
            - navn: Flurry of Blows
              tekst: 1 Focus Point, efter Attack-handlingen.
            - navn: Patient Defense
              tekst: '1 Focus Point: Dodge.'
            - navn: Step of the Wind
              tekst: '1 Focus Point: Dash eller Disengage.'
            - navn: Stonecunning
              tekst: Tremorsense på sten (PB gange pr. Long Rest).
          - type: tur
            undertitel: nærkamp
            titel: HUG!
            punkter:
            - '<b>Attack</b>: Unarmed Strike, d20{+DEX+PB}. Rammer du: 1d10{+DEX}.'
            - <b>Flurry of Blows</b> (1 FP) som Bonus Action.
            - <b>Stunning Strike</b> (1 FP) på første træf.
          - type: tur
            undertitel: fare
            titel: UNDVIG!
            punkter:
            - <b>Deflect Attacks</b> (Reaction) mod slag og stik.
            - <b>Patient Defense</b> (1 FP) som Bonus Action.
