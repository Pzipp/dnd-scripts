# ── Side 4 · Baggrundsark ──
baggrundsark:
  ident:
  - [Art, Menneske]
  - [Baggrund, Farmer]
  - [Fra, Gården ved skovkanten]
  venstre:
  - titel: Udseende <i>Appearance</i>
    type: fakta
    felter:
    - [Alder, barn]
    - [Højde, lille]
    - [Vægt, '']
    - [Øjne, '']
    - [Hår, '']
    - [Tøj, landmandstøj]
  - titel: Historie <i>Backstory</i>
    type: tekst
    afsnit:
    - Mighty Bird voksede op på en lille gård ved skovkanten sammen med sin mor, sin far og en flok dyr. Han var den mindste, så hans far kaldte ham <b>Bird</b>. Men når han svingede øksen, sagde de andre på gården <b>Mighty Bird</b>, og navnet blev hængende.
    - Han hentede køerne hjem, passede marken og fældede træer med sin fars store økse. Om efteråret hakkede han brænde til hele vinteren, og ingen kunne hugge hurtigere.
    - 'Men han havde et temperament som et tordenvejr. Blev han vred, gik der ting i stykker: hegn, spande og engang hele dørene til laden. Hans familie elskede ham, men gården kunne ikke holde til ham. Så en morgen pakkede han sin økse, et par håndøkser og lidt brød og gik ud for at se verden.'
    - Han savner gården og vil gerne hjem på besøg, når han har noget at fortælle.
    tomme: 3
  - {titel: Træning og valg <i>Proficiencies</i>, type: traening}
  hoejre:
  - titel: Personlighed
    punkter:
    - Modig, stærk og nysgerrig.
    - Temperament som et tordenvejr.
    - Ved ikke meget om verden, men vil gerne se den.
    tomme: 2
  - titel: Familie og venner
    punkter: [<b>Mor</b> · på gården, '<b>Far</b> · på gården, kaldte ham Bird']
    tomme: 4
  - titel: Fjender og rivaler
    punkter: []
    tomme: 5
  - titel: Mål og drømme
    punkter: [Se verden, Komme hjem på besøg med gode historier]
    tomme: 4
  - titel: Hemmeligheder
    punkter: []
    tomme: 5
