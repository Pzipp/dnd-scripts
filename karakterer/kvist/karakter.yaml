    - Ødelagt skind
    tomme: 5
  - {titel: Penge <i>Coins</i>, type: penge}
  hoejre:
  - titel: Særlige genstande
    punkter: []
    tomme: 5
  - titel: Kampagne og mission
    punkter: []
    tomme: 14
  - titel: Steder
    punkter: []
    tomme: 8
  - titel: Personer og væsner
    punkter: []
    tomme: 13

