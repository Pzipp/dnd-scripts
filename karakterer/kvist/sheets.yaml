  layout:
  - type: stats
  - columns:
    - width: 52
      content:
      - type: abilities
      - type: passive
        title: Passive sanser
      - type: languages
        title: Sprog <em>Languages</em>
        text: Common, Goblin, Orc, Undercommon, <em>Thieves' Cant</em>
    - width: 140
      content:
      - type: attacks
        title: Angreb <em>· Attacks</em>
        attacks:
        - - Kortsværd <em>Shortsword</em>
          - '{+DEX+PB}'
          - 1d6{+DEX} Piercing
          - Finesse, Light · ingen mastery
        - - Dolk ×2 <em>Dagger</em>
          - '{+DEX+PB}'
          - 1d4{+DEX} Piercing
          - <b>Nick</b> · kast 20/60 ft
        - - Dolk (ekstra) <em>Dagger</em>
          - '{+DEX+PB}'
          - 1d4 Piercing
          - 'Light-ekstraangreb: ingen DEX til skaden'
        - - Kortbue <em>Shortbow</em>
          - '{+DEX+PB}'
          - 1d6{+DEX} Piercing
          - <b>Vex</b> · 80/320 ft · to hænder · 20 pile
        - - Ubevæbnet <em>Unarmed Strike</em>
          - '{+STR+PB}'
          - '{1+STR} Bludgeoning'
          - ''
      - type: rules
        title: Snigangreb
        subtitle: Sneak Attack +1d6, én gang pr. tur
        items:
        - Kræver <em>Finesse</em>- eller afstandsvåben (alle dine våben undtagen ubevæbnet).
        - Og <b>enten</b> <em>Advantage</em> på angrebet, <b>eller</b> en allieret inden for 5 ft af målet (ikke <em>Incapacitated</em>), og du har ikke <em>Disadvantage</em>.
        - Kan bruges på et af de to nærkampsangreb. Ram med det første, så du ikke spilder chancen.
      - columns:
        - width: 1
          content:
          - type: features
            title: Evner &amp; træk <em>· Features</em>
            items:
            - name: Kattens Held []
              tag: 1× Long Rest
              text: 'Slår du 1 på en d20 (angreb, save, check): slå om, du skal bruge det nye slag.'
            - name: Stædig Uvilje [][]
              tag: Long Rest
              text: <em>Advantage</em> på saves mod at blive / slippe fri af <em>Charmed</em> eller <em>Frightened</em>. Antal = PB (3 fra level 5).
            - name: Lige på Alle Fire
              text: <em>Advantage</em> på saves mod <em>Prone</em>. Fald ≤ 20 ft tæller som 10 ft (1d6), og du lander på benene.
            - name: Mørkesyn <em>Darkvision</em>
              text: 60 ft. Mørke ses som svagt lys, kun i gråtoner.
            - name: Thieves' Cant
              text: Tyvenes hemmelige sprog og tegn.
        - width: 1
          content:
          - type: bonus_actions
            title: Bonus actions
            items:
            - name: Cunning Action
              text: <em>Dash</em> (60 ft i alt), <em>Disengage</em> eller <em>Hide</em>.
            - name: Hide
              text: 'Stealth {+DEX+2*PB} mod DC 15. Kræver <em>Heavily Obscured</em> eller ¾ dækning. Lykkes det: <em>Invisible</em> → fordel → Sneak Attack.'
          - type: turn
            subtitle: afstand
            title: Bue med Vex
            items:
            - '<b>Attack</b>: Shortbow. Rammer du → <b>Vex</b> giver <em>Advantage</em> på næste angreb mod samme mål.'
            - 'Næste tur: skyd med <em>Advantage</em> → <b>Sneak Attack</b> (1d6{+DEX} + 1d6).'
            - '<b>Bonus Action</b>: <em>Hide</em> eller flyt dig væk.'
          - type: turn
            subtitle: nærkamp
            title: Sværd + dolk
            items:
            - '<b>Attack</b>: Shortsword (står en allieret ved målet → <b>Sneak Attack</b>).'
            - 'Samme <b>Attack</b>-handling: dolk-ekstraangreb via <b>Nick</b> (bruger ikke din <em>Bonus Action</em>).'
            - '<b>Bonus Action</b>: <em>Disengage</em> og smut væk.'
  footer: 'D&amp;D 2024 · PHB 2024 s. 129–130 (Rogue). Felis er en hjemmelavet race. Light-reglen: ekstraangrebet skal være med et <b>andet</b> Light-våben.'
