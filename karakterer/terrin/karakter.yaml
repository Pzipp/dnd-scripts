    - '<b>Bånd</b>: minderne om moren Elira og hendes alkymi · lillesøsteren Talla.'
    - '<b>Brister</b>: ser vold som en praktisk løsning · forventer altid forræderi · tager den nemmeste vej, også når den er blodig.'
