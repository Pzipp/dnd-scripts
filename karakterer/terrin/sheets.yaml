  layout:
  - columns:
    - width: 1
      content:
      - type: appearance
        title: Udseende <i>Appearance</i>
        fields:
        - - Alder
          - '24'
        - - Køn
          - Mand
        - - Størrelse
          - Lille
        - - Højde
          - 85 cm
        - - Vægt
          - 18 lb.
        - - Øjne
          - Lysebrune
        - - Hår
          - Mørkebrunt, lidt for langt
        - - Hud
          - Lys med et strejf af vejr og støv fra vejen
      - type: traits
        title: Kendetegn
        items:
        - Hænderne er altid i gang.
        - Terin Stoutkettle er lille, selv for en halfling, med et vågent blik og et smil, der sjældent helt afslører, hvad han tænker.
        - Han ser venlig ud, men der er altid en beregnende glød bag øjnene.
        - Hans mørkebrune hår er lidt for langt, og hans lommer er fyldt med små værktøjer og nips.
        - Han bevæger sig lydløst og har en uro i kroppen, som om han hele tiden er klar til enten at stikke af eller slå først.
      - type: backstory
        title: Historie <i>Backstory</i>
        paragraphs:
        - Terin voksede op i en beskeden husholdning i udkanten af en landsby. Hans mor, Elira Stoutkettle, var alkymist og solgte salver, urter og små “mirakler” på markeder.
        - Hans far, Darrin Stoutkettle, forsvandt, da Terin var omkring syv vintre gammel. Nogle sagde, han var rejst, andre at han aldrig kom hjem fra en handel.
        - Elira klarede sig, og Terin lærte både hendes håndværk og hendes evne til at overleve — men også, at nogle gange må man tage, før andre tager fra én.
        - Som dreng stjal han småting, ingredienser og mønter; som teenager tog han større chancer.
        - Et af de sidste kup gik galt. En mand døde, og Terin flygtede. Han var femten, da han forlod hjemmet — og har siden levet af hurtige hænder og hurtige beslutninger.
        - Han har en yngre søster, Talla, som han ikke har set siden. Nogle nætter drømmer han, at hun kalder på ham, men han ved ikke, om det er skyld eller savn.
        blank_lines: 1
      - type: training
        title: Træning og valg <i>Proficiencies</i>
        items:
        - '<b>Sprog (fuld liste)</b>: Common, Dwarvish, Halfling, Orc, <em>Thieves'' Cant</em>'
    - width: 1
      content:
      - type: personality
        title: Personlighed
        items:
        - '<b>Træk</b>: roligt ydre, men hurtigt temperament, når nogen udnytter ham. Holder sine hænder beskæftigede — pusler med en kniv, kaster en mønt, eller tjekker udstyr — aldrig helt afslappet.
          Har en tør humor, især når tingene bliver farlige.'
        - '<b>Idealer</b>: overlevelse og frihed. Ingen skal have magt over hans liv.'
        - '<b>Bånd</b>: minderne om moren Elira og hendes alkymi · lillesøsteren Talla.'
        - '<b>Brister</b>: ser vold som en praktisk løsning · forventer altid forræderi · tager den nemmeste vej, også når den er blodig.'
      - type: backstory
        title: Tro
        paragraphs:
        - Terin er ikke religiøs. Han ved, at guder findes, men han har aldrig set dem gøre noget for folk som ham.
      - type: family
        title: Familie og venner
        items:
        - <b>Elira</b> · mor · alkymist
        - <b>Talla</b> · lillesøster
        blank_lines: 2
      - type: enemies
        title: Fjender og rivaler
        items:
        - Terin forlod sit hjem som femtenårig efter et mislykket tyveri, der endte med blod.
        - Han ved ikke, om nogen stadig leder efter ham — men han antager det.
        - I enhver større by holder han øje med ansigter, der stirrer lidt for længe.
        blank_lines: 5
      - type: goals
        title: Mål og drømme
        items: []
        blank_lines: 6
      - type: secrets
        title: Hemmeligheder
        items: []
        blank_lines: 6
  footer: Terrin Stoutkettle · Baggrund og personlighed
