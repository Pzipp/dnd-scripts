      - type: rules
        title: Snigangreb
        subtitle: Sneak Attack +1d6, én gang pr. tur
        items:
        - Kræver <em>Finesse</em>- eller afstandsvåben (alle dine våben undtagen ubevæbnet).
        - Og <b>enten</b> <em>Advantage</em> på angrebet, <b>eller</b> en allieret inden for 5 ft af målet (ikke <em>Incapacitated</em>), og du har ikke <em>Disadvantage</em>.
        - Kan bruges på et af de to nærkampsangreb. Ram med det første, så du ikke spilder chancen.
      - columns:
        - width: 1
          content:
          - type: features
            title: Evner &amp; træk <em>· Features</em>
            items:
            - name: Held <em>Luck</em>
              tag: Passiv
              text: 'Slår du 1 på en d20 (angreb, save, check): slå om, du skal bruge det nye slag.'
            - name: Modig <em>Brave</em>
              text: <em>Advantage</em> på saves mod at blive / slippe fri af <em>Frightened</em>.
            - name: Halfling-smidighed <em>Nimbleness</em>
              text: Gå gennem pladsen af en større skabning, men ikke stoppe der.
            - name: Naturligt snigende
              text: Må <em>Hide</em>, når du kun er skjult bag en større skabning.
            - name: Alert
              tag: Feat
              text: +PB på initiativ (allerede regnet med). Lige efter initiativ må du <b>bytte</b> initiativ med en villig allieret.
            - name: Thieves' Cant
              text: Tyvenes hemmelige sprog og tegn.
        - width: 1
          content:
          - type: bonus_actions
            title: Bonus actions
            items:
            - name: Cunning Action
              text: <em>Dash</em> (60 ft i alt), <em>Disengage</em> eller <em>Hide</em>.
            - name: Hide
              text: 'Stealth {+DEX+2*PB} mod DC 15. Kræver <em>Heavily Obscured</em> eller ¾ dækning – eller bare en større allieret (<em>Naturligt snigende</em>). Lykkes det: <em>Invisible</em> → fordel
                → Sneak Attack.'
          - type: turn
            subtitle: nærkamp
            title: Sværd + dolk
            items:
            - '<b>Attack</b>: Shortsword. Rammer du → <b>Vex</b> giver <em>Advantage</em> på næste angreb mod samme mål.'
            - 'Samme <b>Attack</b>-handling: dolk-ekstraangreb via <b>Nick</b> (bruger ikke din <em>Bonus Action</em>).'
            - '<b>Bonus Action</b>: <em>Disengage</em> og gå væk, eller <em>Hide</em>.'
          - type: turn
            subtitle: afstand
            title: Skjul og skyd
            items:
            - '<b>Bonus Action</b>: <em>Hide</em> bag en Medium allieret.'
            - Lykkes det → <em>Invisible</em> → <em>Advantage</em> → <b>Sneak Attack</b>.
            - '<b>Attack</b>: Light Crossbow, 1d8{+DEX} + 1d6.'
  footer: 'D&amp;D 2024 · PHB 2024 s. 129–130 (Rogue), 193 (Halfling), 200 (Alert). Light-reglen: ekstraangrebet skal være med et <b>andet</b> Light-våben.'
