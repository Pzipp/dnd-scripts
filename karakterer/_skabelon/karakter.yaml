# ═══════════════════════════════════════════════════════════════════════════════
# SKABELON: karakterark (D&D 2024, dansk, A4)
#
# Brug:
#   1. cp -r karakterer/_skabelon karakterer/<navn>   (små bogstaver og bindestreg)
#   2. Ret denne fil og kort.yaml.
#   3. python3 dnd.py tjek   ·   python3 dnd.py karakterark <navn> --pdf
#
# Formatet er beskrevet i docs/karakterark-yaml.md. Ting, der står med "valgfri", må slettes.
# Hvis en valgfri nøgle mangler, bruger generatoren standarden, som står i kommentaren.
# ═══════════════════════════════════════════════════════════════════════════════

titel: Mit karakterark        # titel på HTML/PDF-filen. Valgfri. Standard: faelles.navn

# ── Fælles felter: bruges af alle sider ──────────────────────────────────────────
faelles:
  navn: Navn                  # karakterens navn, vises som stor titel på sidehovedet
  ident:                      # sidehovedets lille tabel. Højst 4 par. Standard: tom
  - [Klasse, Fighter 1]       # [etiket, værdi]. Skriv "…, …" i citationstegn, hvis værdien har komma
  - [Art, Human]
  - [Baggrund, Soldier]
  - [Spiller, Dit navn]
  evner: {STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10}   # de seks scores. Modifier regnes ud
  mod: {}                     # valgfri. Tving en modifier, hvis papirets tal afviger. Standard: {}
  pb: 2                       # Proficiency Bonus. Standard: 2
  level: 1                    # bruges til Hit Dice i stat-rækken. Standard: 1
  hp: 10                      # Max HP, skrevet som tal. Standard: "?"
  ac: '{10+DEX}'              # AC som formel. Standard: '{10+DEX}'. Ret til fx '{13+DEX}' med rustning
  fart: 30                    # Speed i ft. Standard: 30
  hit_die: 10                 # 6, 8, 10 eller 12. Standard: 8
  saves: []                   # trænede saving throws, fx [STR, CON]. Standard: []
  skills: []                  # trænede skills med engelske navne som i PHB. Standard: []
  expertise: []               # skills med dobbelt bonus (vises ◆). Standard: []
  vaerktoej: {}               # værktøj under en evne, fx {DEX: ["Thieves' Tools"]}. Standard: {}
  sprog: Common               # sprog som tekst. Standard: tom
  kan_bruge:                  # vises under "Træning og valg". Standard: tom
    Rustning: Alle
    Våben: Simple + Martial
  masteries: []               # Weapon Mastery som [[mastery, våben]], fx [[Cleave, Greataxe]]. Standard: []
  feats: []                   # feats som tekst. Standard: []
  traening_ekstra: []         # ekstra linjer under "Træning og valg". Standard: []

# ── Sider: én post pr. side, i den rækkefølge de udskrives ───────────────────────
sider:

# ── Side 1 · Karakterark ─────────────────────────────────────────────────────────
- margin: small              # normal eller small. Small giver ca. 6 mm mere bredde. Standard: normal (her small, fordi siden ellers går ud)
  top: {}                    # sidehoved med faelles.navn og faelles.ident. Udelad hele top, hvis der ikke skal være sidehoved
  layout:                    # bokse, kolonner og rækker. Rækkefølgen er læse- og placeringsrækkefølgen
  - type: stats              # stat-rækken øverst. Uden "felter" bruges standarden (AC, HP, Hit Dice, Initiativ, Fart, Prof. bonus, Passiv Perception)
  - kolonner:                # kolonner står side om side. Bredden er relativ: 1 og 2 giver 1/3 og 2/3

    - bredde: 1              # kolonnens relative bredde. Standard: 1
      indhold:
      - type: evner          # de seks evner med saves, skills og værktøj. Hentes fra faelles. Står i en kolonne, så den ikke fylder hele bredden
      - type: sprog         # sprog. Standard titel: "Sprog"
        titel: Sprog
        tekst: Common
      - type: passiv         # passive sanser
        titel: Passive sanser    # valgfri. Standard: "Passive sanser"
        punkter:
        - [Perception, '{10+WIS}']    # [etiket, værdi]. Formler i {…} regnes ud

    - bredde: 2
      indhold:
      - type: angreb         # angrebstabel
        titel: Angreb <em>· Attacks</em>
        angreb:              # [våben, ramme, skade, noter]. {+STR+PB} = ramme, {+STR} i skade = skadebonus
        - [Kortsværd <em>Shortsword</em>, '{+STR+PB}', '1d6{+STR} Slashing', '']
      - type: regler         # punktliste, fx en særlig evne. "undertitel" er valgfri
        titel: Snigangreb
        undertitel: én gang pr. tur
        punkter:
        - Skriv en regel her.
      - kolonner:            # en kolonne inde i en kolonne. Det er tilladt
        - bredde: 1
          indhold:
          - type: traek      # evner og træk. Hvert punkt har navn, tekst og valgfri tag
            titel: Evner &amp; træk
            punkter:
            - navn: Eksempel <em>Example</em>
              tag: Passiv    # valgfri lille etiket
              tekst: Skriv teksten her.
        - bredde: 1
          indhold:
          - type: bonus          # bonus actions. Standard titel: "Bonus actions"
            titel: Bonus actions
            punkter:
            - navn: Cunning Action
              tekst: <em>Dash</em> eller <em>Disengage</em>.
          - type: tur        # "Din tur"-plan. Kort, én pr. situation
            titel: Nærkamp
            undertitel: nærkamp
            punkter:
            - '<b>Attack</b>: skriv planen her.'
  foot: 'Kilde: PHB 2024'    # sidefod. Valgfri. Standard: ingen

# ── Side 2 · Handlinger ──────────────────────────────────────────────────────────
- margin: small
  top:
    undertitel: Hvad kan jeg gøre?    # lille kursiv tekst ved titlen. Valgfri
    ident:                            # valgfri. Standard: faelles.ident
    - [Slag, d20 + tallet]
    - [Fordel, "2 d20, tag højeste"]  # citationstegn, fordi værdien har komma
    - [Ulempe, "2 d20, tag laveste"]
  layout:
  - type: handlinger         # den faste handlingstabel. Kommer med sin egen kasse
    bonus: {Dash: Cunning Action}   # valgfri. Handling: Bonus Action-tag. Standard: {}
  - kolonner:
    - bredde: 1
      samlet: tæt           # samlet: true = hele kolonnen i én kasse, boksene uden egen ramme. tæt = samme, men mindre skrift. Standard: false
      indhold:
      - type: ubevaebnet     # slag, Grapple og Shove. Titel er valgfri
      - type: bevaegelse     # fart, klatring, spring og fald
      - type: ekstra         # egne punkter, fx racetræk
        titel: Egne træk
        punkter:
        - '<b>Navn</b>: teksten.'
      - type: livsredning    # death saves og hvil. Ingen data nødvendig
      - type: mastery        # valgte Weapon Mastery. Hentes fra faelles.masteries
      - type: nyttige        # faste nyttige ting. Ingen data nødvendig
    - bredde: 1.25
      samlet: tæt           # samlet: tæt = samme som true, men mindre skrift og tættere mellemrum
      indhold:
      - type: situationer    # skill checks. Hentes fra faelles.skills og expertise
        vaerktoej:           # valgfri. Værktøj under "Hvad slår jeg?". Standard: []
        - {navn: Thieves' Tools, evne: DEX, brug: 'Dirke en lås'}   # niveau: p (standard) eller e
      - type: tilstande      # tilstande (conditions). Ingen data nødvendig
  foot: "Kilde: Player's Handbook 2024 · kap. 1 (handlinger)"

# ── Side 3 · Udstyr ──────────────────────────────────────────────────────────────
- margin: small
  top:
    ident:                   # valgfri. Standard: faelles.ident
    - [Klasse, Fighter 1]
  layout:
  - kolonner:
    - bredde: 1
      indhold:
      - type: vaaben         # våben og rustning. Standard titel: "Våben og rustning"
        punkter:             # punkter kan også være tomme []. Brug · mellem dansk og engelsk navn
        - Læderrustning <i>Leather Armor</i> · AC 11 + DEX
        tomme: 2             # antal tomme linjer efter punkterne. Standard: 0
      - type: udstyr         # udstyr. Standard titel: "Udstyr <i>Equipment</i>"
        punkter: []
        tomme: 6
      - type: sarlige        # særlige genstande. Standard titel: "Særlige genstande"
        punkter:
        - <b>Eksempel</b> <i>Hjemmelavet</i> · en genstand med en effekt.
        tomme: 2
      - type: penge          # møntfelter PP GP EP SP CP. Ingen data nødvendig
    - bredde: 1
      indhold:
      - type: kampagne       # kampagne og mission. Standard titel: "Kampagne og mission"
        punkter: []
        tomme: 10
      - type: steder         # steder. Standard titel: "Steder"
        punkter: []
        tomme: 6
      - type: personer       # personer og væsner. Standard titel: "Personer og væsner"
        punkter: []
        tomme: 6

# ── Side 4 · Baggrund ────────────────────────────────────────────────────────────
- margin: small
  top:
    ident:
    - [Art, Human]
    - [Baggrund, Soldier]
    - [Holdning, Neutral]   # valgfri ekstra linje
  layout:
  - kolonner:
    - bredde: 1
      indhold:
      - type: udseende       # nøgle/værdi-felter. Standard titel: "Udseende <i>Appearance</i>"
        felter:              # [etiket, værdi]. Tom værdi '' giver en skrivelinje
        - [Alder, '']
        - [Højde, '']
      - type: kendetegn      # punktliste med linjer. Standard titel: "Kendetegn"
        punkter: []
        tomme: 3
      - type: historie       # løbende tekst. Standard titel: "Historie <i>Backstory</i>"
        afsnit:              # hvert element er et afsnit
        - Skriv baggrundshistorien her.
        tomme: 4
      - type: traening       # træning og valg. Bygges automatisk ud fra faelles. Ingen data nødvendig
    - bredde: 1
      indhold:
      - type: personlighed   # standard titel: "Personlighed"
        punkter: []
        tomme: 4
      - type: familie        # standard titel: "Familie og venner"
        punkter: []
        tomme: 4
      - type: fjender        # standard titel: "Fjender og rivaler"
        punkter: []
        tomme: 4
      - type: maal           # standard titel: "Mål og drømme"
        punkter: []
        tomme: 4
      - type: hemmeligheder  # standard titel: "Hemmeligheder"
        punkter: []
        tomme: 4
