# ═══════════════════════════════════════════════════════════════════════════════
# SKABELON: karakterark (D&D 2024, dansk, A4)
#
# Sådan bruger du den:
#   1. Kopiér hele mappen:   cp -r karakterer/_skabelon karakterer/<dit-karakternavn>
#      (små bogstaver og bindestreg, fx "mighty-bird")
#   2. Ret denne fil (karakter.yaml) og kort.yaml til din karakter.
#   3. Tjek og lav arkene:   python3 dnd.py tjek
#                            python3 dnd.py karakterark <dit-karakternavn> --pdf
#
# Formatet er beskrevet i docs/karakterark-yaml.md. Der skrives ikke på arkene (noter tages på papir).
# ═══════════════════════════════════════════════════════════════════════════════

titel: Mit karakterark        # titel på HTML/PDF-filen

# ── Fælles felter: bruges af alle sider ──
faelles:
  navn: Navn
  ident:                      # højst 4 par: [etiket, værdi]
  - [Klasse, Fighter 1]
  - [Art, Human]
  - [Baggrund, Soldier]
  - [Spiller, Dit navn]
  evner: {STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10}
  pb: 2
  level: 1
  hp: 10
  ac: '{10+DEX}'              # tal eller formel, fx '{13+DEX}'
  fart: 30
  hit_die: 10
  saves: []                   # trænede saves, fx [STR, CON]
  skills: []                  # trænede skills (engelske navne som i PHB)
  expertise: []               # skills med dobbelt bonus
  sprog: Common
  kan_bruge:                  # vises under Træning og valg
    Rustning: Alle
    Våben: Simple + Martial
  masteries: []               # [[mastery, våben]], fx [[Cleave, Greataxe]]
  feats: []

# ── Sider: én post pr. side, i udskriftsrækkefølge ──
sider:

# ── Side 1 · Karakterark ──
- top: {}                     # sidehoved med faelles.navn og faelles.ident
  layout:
  - type: stats               # stat-rækken. Uden felter bruges standarden ud fra faelles
  - kolonner:

    - bredde: 1               # relativ bredde: 1 og 2 giver 1/3 og 2/3
      indhold:
      - type: evner
      - type: passiv
        titel: Passive sanser
        punkter:
        - [Perception, '{10+WIS}']
      - type: sprog
        titel: Sprog
        tekst: Common

    - bredde: 2
      indhold:
      - type: angreb
        titel: Angreb <em>· Attacks</em>
        angreb:
        - [Kortsværd <em>Shortsword</em>, '{+STR+PB}', '1d6{+STR} Slashing', '']
      - type: regler
        titel: Træk
        punkter:
        - Skriv punkter her.
  foot: 'Kilde: PHB 2024'     # valgfri sidefod

# ── Side 2 · Handlinger ──
- top:
    undertitel: Hvad kan jeg gøre?
  layout:
  - type: handlinger          # standard handlingstabel
  - kolonner:

    - bredde: 1
      indhold:
      - type: ubevaebnet
      - type: bevaegelse

    - bredde: 1
      indhold:
      - type: situationer

# ── Side 3 · Udstyr ──
- top:
    ident:
    - [Klasse, Fighter 1]
  layout:
  - kolonner:

    - bredde: 1
      indhold:
      - type: vaaben
        punkter:
        - Skriv våben her.
        tomme: 3
      - type: udstyr
        punkter: []
        tomme: 6
      - type: penge

    - bredde: 1
      indhold:
      - type: tilstande
      - type: kampagne
        punkter: []
        tomme: 10

# ── Side 4 · Baggrund ──
- top:
    ident:
    - [Art, Human]
    - [Baggrund, Soldier]
  layout:
  - kolonner:

    - bredde: 1
      indhold:
      - type: udseende
        felter:
        - [Alder, '']
        - [Højde, '']
      - type: historie
        afsnit:
        - Skriv baggrundshistorie her.
      - type: traening

    - bredde: 1
      indhold:
      - type: personlighed
        punkter: []
        tomme: 4
      - type: familie
        punkter: []
        tomme: 4
