# ── Side 4 · Baggrundsark ──
baggrundsark:
  ident:
  - [Art, Halfling]
  - [Baggrund, Criminal]
  venstre:
  - titel: Udseende <i>Appearance</i>
    type: fakta
    felter: [[Alder, ''], [Højde, ''], [Vægt, ''], [Øjne, ''], [Hår, ''], [Tøj, '']]
  - titel: Historie <i>Backstory</i>
    type: tekst
    afsnit:
    - Jogoha voksede op i havnekvarteret, hvor man lærer at se, hvem der har penge i lommen, før de selv gør det.
    - Hun har aldrig ment at stjæle fra folk, der ikke kan undvære det. Derfor fik hun et ry for at være den, man kan gå til, når noget skal væk fra en fed kasse.
    tomme: 3
  - {titel: Træning og valg <i>Proficiencies</i>, type: traening}
  hoejre:
  - {titel: Personlighed, punkter: [Lun, Nysgerrig], tomme: 2}
  - {titel: Familie og venner, punkter: [], tomme: 4}
  - {titel: Fjender og rivaler, punkter: [], tomme: 5}
  - {titel: Mål og drømme, punkter: [], tomme: 4}
  - {titel: Hemmeligheder, punkter: [], tomme: 5}
