            punkter:
            - navn: Expertise
              tekst: Sleight of Hand og Stealth (dobbelt bonus).
            - navn: Sneak Attack
              tag: 1 gang pr. tur
              tekst: 2d6 ekstra skade med Finesse- eller afstandsvåben, når du har Advantage, eller når en ven er inden for 5 ft af målet (og du ikke har Disadvantage).
            - navn: Thieves' Cant
              tekst: Hemmeligt tyve-sprog, som kan skjule beskeder i almindelig tale.
            - navn: Weapon Mastery
              tekst: Shortsword (Vex) og Dagger (Nick). Kan byttes ved Long Rest.
            - navn: Cunning Action
              tekst: 'Bonus Action: Dash, Disengage eller Hide.'
            - navn: Steady Aim
              tekst: 'Bonus Action: Advantage på næste angreb i turen. Din bevægelse er 0 den tur.'
            - navn: Thief · Fast Hands
              tekst: 'Bonus Action: Sleight of Hand til lås, fælde eller lommetyveri. Eller Utilize-handling, eller Magic-handling med magisk genstand.'
            - navn: Thief · Second-Story Work
              tekst: Klatrefart lig med din fart. Spring-længde ud fra DEX.
            - navn: Brave
              tekst: Advantage på saves mod at blive eller forblive Frightened.
            - navn: Halfling Nimbleness
              tekst: Du kan bevæge dig gennem væsners plads, der er én størrelse større end dig.
            - navn: Luck
              tekst: Slår du en 1 på d20, må du slå om og bruge det nye resultat.
            - navn: Naturally Stealthy
              tekst: Hide-handling, selv når du kun er skjult af et væsen mindst én størrelse større.
        - bredde: 1
          indhold:
          - type: bonus
            titel: Bonus actions
            punkter:
            - navn: Cunning Action
