# Jogoha karakterark (D&D 2024).
# Felt-reference: docs/karakterark-yaml.md · kommenteret skabelon: karakterer/_skabelon/karakter.yaml
# Lav ark:  python3 dnd.py karakterark jogoha

titel: Jogoha karakterark

# ── Fælles felter: gælder alle versioner ──
faelles:
  navn: Jogoha
  ident:
  - [Klasse, Rogue 3 · Thief]
  - [Art, Halfling]
  - [Baggrund, Criminal]
  pb: 2
  fart: 30
  hit_die: 8
  saves: [DEX, INT]
  skills: [Acrobatics, Deception, Investigation, Perception, Sleight of Hand, Stealth]
  expertise: [Sleight of Hand, Stealth]
  vaerktoej:
    DEX: ["Thieves' Tools"]
  sprog: Common og Halfling
  kan_bruge:
    Rustning: Light armor
    Våben: Simple, Martial med Finesse eller Light
    Værktøj: "Thieves' Tools, Gaming Set (Dice)"
  masteries:
  - [Vex, Shortsword]
  - [Nick, Dagger]
  feats:
  - 'Alert fra Criminal: +PB til initiativ, kan ikke overraskes, angreb fra usete fjender får ikke Advantage'
  passiv:
  - [Perception, '{10+WIS+PB}']
  - [Insight, '{10+WIS}']
  - [Investigation, '{10+INT+PB}']
  fod: D&amp;D 2024 · PHB 2024 kap. 3 (Rogue, Thief), kap. 4 (Halfling, Criminal og Alert)

# ── Side 1 · Karakterark ──
versioner:
- version: Version A · level 3
  evner: {STR: 8, DEX: 17, CON: 14, INT: 14, WIS: 12, CHA: 10}
  stats:
  - [<em>AC</em>, '{11+DEX}', Leather Armor]
  - [Max HP, '24', 8+CON + 2×(5+CON)]
  - [<em>Hit Dice</em>, 3d8, 1 d8 pr. level]
  - [<em>Initiative</em>, '{+DEX+PB}', DEX + Alert]
  - [<em>Speed</em>, '30', 'Dash: 60']
  - [<em>Proficiency Bonus</em>, '{+PB}', level 1–4]
  - [Passive <em>Perception</em>, '{10+WIS+PB}']
  - [<em>Sneak Attack</em>, 2d6, 1 gang pr. tur]

  angreb:
  - [Kortsværd <em>Shortsword</em>, '{+DEX+PB}', '1d6{+DEX} Piercing', '<b>Vex</b> · Finesse, Light']
  - [Dolk <em>Dagger</em>, '{+DEX+PB}', '1d4{+DEX} Piercing', '<b>Nick</b> · kast 20/60 ft']
  - [Ubevæbnet <em>Unarmed Strike</em>, '{+STR+PB}', '{1+STR} Bludgeoning', '']

  traek:
  - {navn: Expertise, tekst: 'Sleight of Hand og Stealth (dobbelt bonus).'}
  - {navn: Sneak Attack, tag: 1 gang pr. tur, tekst: '2d6 ekstra skade med Finesse- eller afstandsvåben, når du har Advantage, eller når en ven er inden for 5 ft af målet (og du ikke har Disadvantage).'}
  - {navn: Thieves' Cant, tekst: 'Hemmeligt tyve-sprog, som kan skjule beskeder i almindelig tale.'}
  - {navn: Weapon Mastery, tekst: 'Shortsword (Vex) og Dagger (Nick). Kan byttes ved Long Rest.'}
  - {navn: Cunning Action, tekst: 'Bonus Action: Dash, Disengage eller Hide.'}
  - {navn: Steady Aim, tekst: 'Bonus Action: Advantage på næste angreb i turen. Din bevægelse er 0 den tur.'}
  - {navn: Thief · Fast Hands, tekst: 'Bonus Action: Sleight of Hand til lås, fælde eller lommetyveri. Eller Utilize-handling, eller Magic-handling med magisk genstand.'}
  - {navn: Thief · Second-Story Work, tekst: 'Klatrefart lig med din fart. Spring-længde ud fra DEX.'}
  - {navn: Brave, tekst: 'Advantage på saves mod at blive eller forblive Frightened.'}
  - {navn: Halfling Nimbleness, tekst: 'Du kan bevæge dig gennem væsners plads, der er én størrelse større end dig.'}
  - {navn: Luck, tekst: 'Slår du en 1 på d20, må du slå om og bruge det nye resultat.'}
  - {navn: Naturally Stealthy, tekst: 'Hide-handling, selv når du kun er skjult af et væsen mindst én størrelse større.'}

  bonus:
  - {navn: Cunning Action, tekst: 'Dash, Disengage eller Hide.'}
  - {navn: Fast Hands, tekst: 'Sleight of Hand til lås, fælde eller lommetyveri.'}
  - {navn: Steady Aim, tekst: 'Advantage på næste angreb. Bevægelse 0 denne tur.'}

  ture:
  - undertitel: nærkamp
    titel: SNIG OG STIK!
    punkter:
    - '<b>Steady Aim</b> (Bonus Action) hvis du har et sikkert mål.'
    - '<b>Attack</b>: Shortsword, d20{+DEX+PB}. Rammer du: 1d6{+DEX} + Sneak Attack 2d6.'
    - '<b>Nick</b>: Dagger som ekstra angreb (ingen Bonus Action).'
  - undertitel: skjult
    titel: USET
    punkter:
    - '<b>Hide</b> (Bonus Action via Cunning Action).'
    - Næste tur: Attack med Advantage og Sneak Attack.

  fod: D&amp;D 2024 · PHB 2024 kap. 3 (Rogue, Thief), kap. 4 (Halfling, Criminal, Alert).

# ── Side 2 · Handlingsark ──
handlingsark:
  bonus_handlinger: {Dash: Cunning Action, Disengage: Cunning Action, Hide: Cunning Action}
  vaerktoej:
  - {navn: "Thieves' Tools", evne: DEX, brug: 'Lås, fælder, lommetyveri (Fast Hands)'}
  ekstra:
  - titel: Thief
    punkter:
    - '<b>Fast Hands</b> (Bonus Action): Sleight of Hand til lås, fælder eller lommetyveri.'
    - '<b>Second-Story Work</b>: Klatrefart lig med din fart. Spring-længde ud fra DEX.'
    - '<b>Steady Aim</b> (Bonus Action): Advantage på næste angreb. Bevægelse 0 denne tur.'

