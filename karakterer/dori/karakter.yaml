              tekst: Resistance mod Poison-skade. Advantage på saves mod at blive Poisoned.
            - navn: Dwarven Toughness
              tekst: Din HP-maksimum stiger med 1 pr. level.
            - navn: Darkvision
              tekst: 120 ft. Mørke ses som svagt lys, kun i gråtoner.
            - navn: Disciple of Life
              tekst: Når du helbreder med en besværgelse, får modtageren ekstra HP lig med 2 + besværgelsens grad.
            - navn: Preserve Life
              tag: Channel Divinity
              tekst: Heal HP lig med 5× din cleric-level, fordelt blandt sårede væsner inden for 30 ft.
