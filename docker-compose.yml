# dnd-webui på homelab. Denne fil er homelabs egen og følger IKKE dnd-repoets
# docker-compose.yml (den kan ændre sig, og kammeraten har sin egen opsætning).
# Koden og Dockerfile kommer fra ../dnd-scripts-dev, der bygges og bind-mountes derfra.
#
# Port 8081 er kun til lokal test (127.0.0.1). Udefra-adgang går via nginx (todo-sebastian punkt 44),
# og containeren er på proxy-netværket, så nginx kan nå den.
name: dnd

services:
  # Opdaterer /srv/e5tools (git-klonen bag 5etools) ved container-start, kun
  # hvis UPDATE_E5TOOLS=true er sat i .env. Kører én gang og stopper -
  # dnd-webui venter på den (se depends_on), men den fejler aldrig hårdt
  # (se update-e5tools.sh), så en manglende opdatering blokerer ikke siden.
  e5tools-updater:
    image: alpine/git
    container_name: e5tools-updater
    entrypoint: ["sh", "/update-e5tools.sh"]
    restart: "no"
    user: "${DND_UID:-1000}:${DND_GID:-1000}"
    environment:
      - UPDATE_E5TOOLS=${UPDATE_E5TOOLS:-false}
    volumes:
      - /srv/e5tools:/e5tools
      - ./update-e5tools.sh:/update-e5tools.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dnd-webui:
    build: ../dnd-scripts-dev
    container_name: dnd-webui
    restart: unless-stopped
    depends_on:
      e5tools-updater:
        condition: service_completed_successfully

    # Samme UID/GID som ejeren af dnd-scripts-dev/-mappen, så genererede filer ejes af sebastian.
    user: "${DND_UID:-1000}:${DND_GID:-1000}"

    # Chromium (PDF) crasher med Dockers standard på 64 MB delt hukommelse.
    shm_size: "512m"

    volumes:
      - .:/app
      # 5etools-data (JSON-regelbøger), read-only - se /srv/e5tools
      - /srv/e5tools:/e5tools:ro
      # Homebrew lægges her (gitignoreret vol/, redigerbar) og mountes OVEN PÅ
      # /e5tools/homebrew, så gruppens eget indhold ikke ryger ved en opdatering
      # eller oprydning af e5tools-klonen, og ikke skal ind i det delte repo.
      - ./vol/homebrew:/e5tools/homebrew

    ports:
      - "${DND_BIND_IP:-127.0.0.1}:${DND_PORT:-8081}:8080"

    environment:
      - TZ=Europe/Copenhagen
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}

    networks:
      - proxy

    labels:
      - "homelab.stack=games"
      - "homelab.service=dnd-webui"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
