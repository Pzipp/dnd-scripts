<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karakterbygger – Kilder</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}">
</head>
<body>
<header class="builder-top">
  <h1>Karakterbygger</h1>
  <div class="meta"><a href="/builder">&larr; Alle karakterer</a></div>
</header>
<main class="sheet" style="border-top:1px solid var(--line)">
  <section class="step">
    <h2>Tilladte kilder</h2>
    <p style="font-size:.85rem;color:var(--muted)">
      Kun valgte kilder bruges, når byggeren slår racer, klasser, baggrunde, feats og spells op.
      Standard er kun <strong>Player's Handbook (2024)</strong>. Listen er bygget ud fra, hvad der
      faktisk findes i /e5tools lige nu.
    </p>
    <div id="source-list" class="source-list"><p>Henter...</p></div>
    <button class="btn" id="save-btn">Gem</button>
    <span id="save-msg" style="margin-left:.6rem;color:var(--muted);font-size:.85rem"></span>
  </section>
</main>
<script>
async function load() {
  const res = await fetch("/api/builder/sources");
  const data = await res.json();
  if (data.error) {
    document.getElementById("source-list").innerHTML = `<p style="color:var(--bad)">${data.error}</p>`;
    return;
  }
  const allowed = new Set(data.allowed);
  const entries = Object.entries(data.all).sort((a, b) => a[0].localeCompare(b[0]));
  document.getElementById("source-list").innerHTML = entries.map(([code, title]) => `
    <label>
      <input type="checkbox" value="${code}" ${allowed.has(code) ? "checked" : ""} ${code === "XPHB" ? "disabled" : ""}>
      <span class="code">${code}</span> ${title}
    </label>`).join("");
}
document.getElementById("save-btn").addEventListener("click", async () => {
  const boxes = document.querySelectorAll("#source-list input[type=checkbox]");
  const allowed = Array.from(boxes).filter((b) => b.checked).map((b) => b.value);
  if (!allowed.includes("XPHB")) allowed.push("XPHB");
  const res = await fetch("/api/builder/sources", {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({allowed}),
  });
  const data = await res.json();
  document.getElementById("save-msg").textContent = data.error ? data.error : "Gemt.";
});
load();
</script>
</body>
</html>
