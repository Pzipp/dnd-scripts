<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karakterbygger – {{ name }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}">
  <!-- Samme CodeMirror-import-map som den gamle YAML-editor (webui/templates/index.html) - til layout-editoren på Print-siden. -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.13?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.4?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/search": "https://esm.sh/@codemirror/search@6.7.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-yaml": "https://esm.sh/@codemirror/lang-yaml@6.1.3?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/common": "https://esm.sh/@lezer/common@1.5.3?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.5?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.10?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.9.7?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.13&external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@replit/codemirror-indentation-markers": "https://esm.sh/@replit/codemirror-indentation-markers@6.5.3?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.13,@codemirror/language@6.12.4&external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr"
    }
  }
  </script>
</head>
<body>
<header class="builder-top">
  <h1>Karakterbygger</h1>
  <div class="meta">
    <a href="/builder">&larr; Alle karakterer</a>
    <span id="total-level"></span>
    <span>{{ name }}</span>
    <span class="status" id="save-status"></span>
  </div>
</header>
<nav class="tabs">
  <button type="button" data-page="character" class="{{ 'active' if page == 'character' else '' }}">Karakter</button>
  <button type="button" data-page="equipment" class="{{ 'active' if page == 'equipment' else '' }}">Udstyr</button>
  <button type="button" data-page="print" class="{{ 'active' if page == 'print' else '' }}">Print</button>
  <button type="button" onclick="location.href='/builder/{{ name }}/settings'">Kilder</button>
</nav>
<main class="sheet">
  <div id="missing-banner" class="missing-banner" style="display:none"></div>
  <div class="page {{ 'active' if page == 'character' else '' }}" id="page-character"></div>
  <div class="page {{ 'active' if page == 'equipment' else '' }}" id="page-equipment"></div>
  <div class="page {{ 'active' if page == 'print' else '' }}" id="page-print">
    <div id="print-banner" class="missing-banner with-action" style="display:none">
      <span id="print-banner-text"></span>
      <button type="button" class="btn secondary" id="translate-btn">Generér beskrivelser</button>
    </div>
    <label class="print-style" for="sheet-style">Udseende
      <select id="sheet-style">
        <option value="farve">Klassisk pergament</option>
        <option value="sorthvid">Sort/hvid</option>
        <option value="moderne">Moderne</option>
        <option value="skov">Skov</option>
        <option value="mork-fantasy">Mørk fantasy</option>
        <option value="kongelig">Kongelig</option>
        <option value="blod-stal">Blod &amp; stål</option>
        <option value="arkanum">Arkanum</option>
        <option value="blaekornament">Blækornament</option>
        <option value="bladkrus">Bladkrus</option>
        <option value="stjernelinje">Stjernelinje</option>
      </select>
    </label>
    <button type="button" class="btn secondary" id="edit-layout-btn" style="margin-bottom:.6rem">Rediger layout</button>
    <div id="sheets-editor" style="display:none">
      <div class="editor-head">
        <span>sheets.yaml</span>
        <span id="sheets-editor-status"></span>
        <button type="button" class="btn" id="sheets-save-btn">Gem</button>
      </div>
      <div id="sheets-editor-mount"></div>
    </div>
    <iframe id="sheet-output" title="Karakterark"></iframe>
  </div>
</main>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h3>Er du sikker?</h3>
    <p id="confirm-text"></p>
    <div class="actions">
      <button class="btn secondary" id="confirm-no">Nej, behold</button>
      <button class="btn" id="confirm-yes">Ja, ryd</button>
    </div>
  </div>
</div>

<script>
  window.BUILDER_NAME = {{ name|tojson }};
</script>
<script type="module" src="{{ url_for('static', filename='builder.js') }}"></script>
</body>
</html>
