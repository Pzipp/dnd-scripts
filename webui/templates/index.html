<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&D WebUI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- CodeMirror 6 hentes fra esm.sh. Versionerne er låst. external=… gør, at alle pakker bruger samme kopi fra import map'et (ellers virker fx lint-markeringer ikke). -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.13?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.4?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/search": "https://esm.sh/@codemirror/search@6.7.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-yaml": "https://esm.sh/@codemirror/lang-yaml@6.1.3?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/common": "https://esm.sh/@lezer/common@1.5.3?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.5?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.10?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.9.7?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.13&external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@replit/codemirror-indentation-markers": "https://esm.sh/@replit/codemirror-indentation-markers@6.5.3?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.13,@codemirror/language@6.12.4&external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr"
    }
  }
  </script>
</head>
<body>
<header class="topbar">
  <h1>D&D WebUI</h1>
  <div class="controls">
    <label>Karakter
      <select id="character">
        {% for character in characters %}
        <option value="{{ character }}">{{ character }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Side
      <select id="kind">
        <option value="karakterark">Karakterark</option>
        <option value="kort">Kort</option>
      </select>
    </label>
    <label>Stil
      <select id="stil">
        <option value="farve">Farve</option>
        <option value="sorthvid">Sort/hvid</option>
      </select>
    </label>
    <label class="check"><input id="pdf" type="checkbox" checked> PDF</label>
    <button id="save" type="button">Gem</button>
    <button id="generate" type="button">Generer</button>
    <div id="downloads" class="downloads"></div>
  </div>
</header>

<main class="layout">
  <section class="panel editor">
    <div class="panel-head">
      <h2>YAML</h2>
      <span>Rediger den rigtige karakterfil</span>
    </div>
    <div id="yaml" class="yaml-editor"></div>
    <div id="status" class="status"></div>
  </section>

  <section class="panel preview">
    <div class="panel-head">
      <h2>Output</h2>
      <span id="preview-info"></span>
      <a id="open-output" href="#" target="_blank" rel="noopener" hidden>Åbn i ny fane</a>
    </div>
    <div id="empty" class="empty">Forhåndsvisningen opdateres, mens du skriver.</div>
    <iframe id="output" title="Genereret D&D output" hidden></iframe>
  </section>
</main>

<script type="module">
import {
  EditorView, keymap, lineNumbers, highlightActiveLine, highlightActiveLineGutter, drawSelection,
} from "@codemirror/view";
import {EditorState} from "@codemirror/state";
import {defaultKeymap, history, historyKeymap, indentWithTab} from "@codemirror/commands";
import {
  bracketMatching, defaultHighlightStyle, foldGutter, foldKeymap, indentUnit, syntaxHighlighting,
} from "@codemirror/language";
import {search, searchKeymap} from "@codemirror/search";
import {yaml} from "@codemirror/lang-yaml";
import {linter, lintGutter} from "@codemirror/lint";
import {indentationMarkers} from "@replit/codemirror-indentation-markers";

const character = document.querySelector("#character");
const kind = document.querySelector("#kind");
const stil = document.querySelector("#stil");
const pdf = document.querySelector("#pdf");
const saveButton = document.querySelector("#save");
const generateButton = document.querySelector("#generate");
const statusBox = document.querySelector("#status");
const output = document.querySelector("#output");
const empty = document.querySelector("#empty");
const openOutput = document.querySelector("#open-output");
const downloads = document.querySelector("#downloads");

const previewInfo = document.querySelector("#preview-info");

let savedYaml = "";
let previewTimer = null;
let previewSeq = 0;
let loadingYaml = false;

// Fejl under editoren: serveren finder dem (YAML-syntaks og layout), og de vises på den linje, de hører til.
async function checkYaml(view) {
  const doc = view.state.doc;
  try {
    const response = await fetch("/api/check", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character: character.value,
        kind: kind.value,
        yaml: doc.toString()
      })
    });
    const data = await response.json();
    if (!response.ok) return [];
    return data.fejl.map((f) => {
      const line = doc.line(Math.min(Math.max(f.linje, 1), doc.lines));
      const from = line.from + Math.min(Math.max(f.kolonne - 1, 0), line.length);
      const to = Math.min(Math.max(line.to, from + 1), doc.length);
      return {from: Math.min(from, to), to, severity: "error", message: f.besked};
    });
  } catch (error) {
    return [];
  }
}

// Editoren: linjenumre, YAML-farver, foldning, indrykningslinjer, fejl, søgning (Ctrl+F) og fortryd. Ctrl+S gemmer.
const editor = new EditorView({
  parent: document.querySelector("#yaml"),
  state: EditorState.create({
    doc: "",
    extensions: [
      lineNumbers(),
      highlightActiveLineGutter(),
      highlightActiveLine(),
      drawSelection(),
      history(),
      foldGutter(),
      bracketMatching(),
      syntaxHighlighting(defaultHighlightStyle, {fallback: true}),
      search({top: true}),
      indentUnit.of("  "),
      EditorState.tabSize.of(2),
      EditorView.lineWrapping,
      yaml(),
      indentationMarkers(),
      lintGutter(),
      linter(checkYaml, {delay: 500}),
      keymap.of([
        {key: "Mod-s", preventDefault: true, run: () => { save(); return true; }},
        indentWithTab,
        ...defaultKeymap,
        ...historyKeymap,
        ...foldKeymap,
        ...searchKeymap,
      ]),
      EditorView.updateListener.of((update) => {
        if (update.docChanged && !loadingYaml) onYamlInput();
      }),
    ],
  }),
});

// Samme grænseflade som før (textarea.value), så resten af scriptet ikke skal ændres.
const yamlBox = {
  get value() {
    return editor.state.doc.toString();
  },
  set value(text) {
    loadingYaml = true;
    editor.dispatch({changes: {from: 0, to: editor.state.doc.length, insert: text}});
    loadingYaml = false;
  },
};

function setStatus(text, error = false) {
  statusBox.textContent = text;
  statusBox.className = error ? "status error" : "status";
}

// Forhåndsvisningen bygges af den YAML, der står i editoren (også ugemt). Ældre svar ignoreres.
function schedulePreview(delay = 600) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, delay);
}

async function updatePreview() {
  const seq = ++previewSeq;
  previewInfo.className = "";
  previewInfo.textContent = "Opdaterer…";
  try {
    const response = await fetch("/api/preview", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character: character.value,
        kind: kind.value,
        stil: stil.value,
        yaml: yamlBox.value
      })
    });
    const data = await response.json();
    if (seq !== previewSeq) return;
    if (!response.ok) throw new Error(data.error || "Forhåndsvisning fejlede.");
    output.srcdoc = data.html;
    output.hidden = false;
    empty.hidden = true;
    previewInfo.textContent = yamlBox.value === savedYaml ? "Gemt" : "Ugemt – viser dine rettelser";
  } catch (error) {
    if (seq !== previewSeq) return;
    // Den sidste gyldige forhåndsvisning bliver stående, så layoutet ikke hopper.
    previewInfo.className = "error";
    previewInfo.textContent = error.message;
  }
}

async function loadFiles() {
  downloads.replaceChildren();
  try {
    const response = await fetch(`/api/files?character=${encodeURIComponent(character.value)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Kunne ikke hente filer.");
    for (const group of ["Data", "Udskrift"]) {
      const files = data.files.filter((f) => f.group === group);
      if (!files.length) continue;
      const box = document.createElement("span");
      box.className = "group";
      const label = document.createElement("strong");
      label.textContent = group === "Data" ? "Karakterfiler:" : "Udskrifter:";
      box.append(label);
      for (const f of files) {
        const link = document.createElement("a");
        link.href = f.url;
        link.textContent = f.name;
        link.download = f.name;
        box.append(link);
      }
      downloads.append(box);
    }
  } catch (error) {
    setStatus(error.message, true);
  }
}

async function loadYaml() {
  saveButton.disabled = true;
  generateButton.disabled = true;
  setStatus("Indlæser YAML…");
  try {
    const response = await fetch(
      `/api/yaml?character=${encodeURIComponent(character.value)}&kind=${encodeURIComponent(kind.value)}`
    );
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Kunne ikke hente YAML.");
    yamlBox.value = data.yaml;
    savedYaml = data.yaml;
    setStatus("");
    updatePreview();
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    saveButton.disabled = false;
    generateButton.disabled = false;
  }
}

function onYamlInput() {
  if (yamlBox.value !== savedYaml) {
    setStatus("Ikke gemt.");
  } else {
    setStatus("");
  }
  schedulePreview();
}
stil.addEventListener("change", () => schedulePreview(0));

async function save() {
  saveButton.disabled = true;
  generateButton.disabled = true;
  setStatus("Gemmer…");
  try {
    const response = await fetch("/api/save", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character: character.value,
        kind: kind.value,
        yaml: yamlBox.value
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Kunne ikke gemme YAML.");
    savedYaml = yamlBox.value;
    setStatus("Gemt.");
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    saveButton.disabled = false;
    generateButton.disabled = false;
  }
}

async function generate() {
  if (yamlBox.value !== savedYaml) {
    setStatus("Gem ændringerne først.", true);
    return;
  }

  generateButton.disabled = true;
  saveButton.disabled = true;
  setStatus("Genererer…");
  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character: character.value,
        kind: kind.value,
        stil: stil.value,
        pdf: pdf.checked
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Generering fejlede.");
    // Samme vej som forhåndsvisningen: HTML'en hentes og vises som srcdoc. Fejler hentningen, står fejlen i statuslinjen.
    const htmlResponse = await fetch(data.url + "?t=" + Date.now(), {cache: "no-store"});
    if (!htmlResponse.ok) throw new Error(`Output kunne ikke hentes (HTTP ${htmlResponse.status}).`);
    output.srcdoc = await htmlResponse.text();
    output.hidden = false;
    empty.hidden = true;
    openOutput.href = data.url;
    openOutput.hidden = false;
    setStatus(data.pdf ? "Færdig – HTML og PDF er gemt i karakterens udskrifter." : "Færdig – output gemt i karakterens udskrifter.");
    loadFiles();
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    generateButton.disabled = false;
    saveButton.disabled = false;
  }
}

character.addEventListener("change", () => { loadYaml(); loadFiles(); });
kind.addEventListener("change", loadYaml);
saveButton.addEventListener("click", save);
generateButton.addEventListener("click", generate);
loadYaml();
loadFiles();
</script>
</body>
</html>
