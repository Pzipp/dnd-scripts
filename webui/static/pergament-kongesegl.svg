    <g fill="#7e2c25" opacity=".72">
      <path d="M-115 21l14 -5 7 9 -13 8Z"/><path d="M98 -57l12 7 -4 11 -13 -4Z"/>
      <path d="M-8 91l10 -11 9 8 -4 12Z"/><path d="M-43 -93l10 7 -5 8 -11 -3Z"/>
    </g>
  </g>
  <g fill="#5c4027" opacity=".2">
    <circle cx="198" cy="227" r="2"/><circle cx="207" cy="234" r="1.2"/>
    <circle cx="989" cy="392" r="1.8"/><circle cx="978" cy="401" r="1.1"/>
    <circle cx="337" cy="671" r="1.5"/><circle cx="814" cy="143" r="1.3"/>
