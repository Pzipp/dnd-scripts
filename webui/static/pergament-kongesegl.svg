    <!-- old, nearly erased royal crest -->
    <g fill="none" stroke="#d8a18a" stroke-opacity=".52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-28 -32L-38 -48 -19 -42 -7 -59 5 -42 26 -49 18 -31"/>
      <path d="M-28 -30L-23 4Q0 28 23 4L28 -30"/>
      <path d="M-14 -7L0 -20 14 -7 0 9Z"/>
      <path d="M-44 18l-11 11 M43 14l12 9 M-5 37l-3 9"/>
    </g>
    <!-- cracks and missing chunks -->
    <path d="M-60 -49l18 13 -7 18 15 9 M31 -57l-9 20 14 14 -8 18 M-22 44l-9 -13 8 -9"
