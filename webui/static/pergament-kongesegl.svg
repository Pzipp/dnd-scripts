    <path d="M-102 -24 Q-92 -83 -36 -91 L-5 -104 L30 -88 Q88 -81 101 -27 L93 24 Q66 77 10 85 L-21 80 Q-81 68 -101 17Z"
      fill="#7a2822" opacity=".12"/>
    <!-- broken wax body -->
    <path d="M-83 -13 L-91 -37 -73 -51 -61 -74 -35 -69 -18 -89 8 -78 29 -88 44 -66 69 -65 72 -42 92 -25 80 -3 87 19 65 33 58 56 30 54 12 75 -9 63 -32 72 -45 51 -68 47 -66 25 -87 11Z"
      fill="url(#wax)" opacity=".91"/>
    <path d="M-69 -23 Q-56 -62 -17 -63 L-2 -73 22 -60 Q57 -57 67 -23 L60 15 Q39 48 5 48 L-24 43 Q-57 32 -69 -2Z"
