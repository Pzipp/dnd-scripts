    <path d="M-7 103Q116 77 191 126T350 114 M850 84Q1002 116 1212 54"/>
    <path d="M125 0Q89 100 133 164T105 290 M1088 0Q1121 84 1080 139T1117 252"/>
    <path d="M300 270l36 14 -14 26 32 11 M823 250l-22 24 18 22 -27 18"/>
  </g>
  <g transform="translate(600 758) rotate(-8)">
