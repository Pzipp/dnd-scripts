<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d8c49a"/>
      <stop offset=".2" stop-color="#f0e1bb"/>
      <stop offset=".56" stop-color="#e2cda0"/>
      <stop offset=".82" stop-color="#ead8ae"/>
      <stop offset="1" stop-color="#c0a779"/>
    </linearGradient>
    <radialGradient id="edge">
      <stop offset=".48" stop-color="#5b3b22" stop-opacity="0"/>
      <stop offset=".84" stop-color="#77502d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3e291a" stop-opacity=".48"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="49"/>
      <feColorMatrix values=".45 0 0 0 .35  0 .35 0 0 .27  0 0 .2 0 .1  0 0 0 .19 0"/>
    </filter>
    <pattern id="fibres" width="91" height="77" patternUnits="userSpaceOnUse">
      <path d="M8 12l18 2 M45 39l25 -3 M16 66l13 -2 M69 9l12 2" stroke="#775a35" stroke-opacity=".18"/>
      <circle cx="37" cy="22" r="1.2" fill="#6b4b2c" fill-opacity=".23"/>
      <circle cx="79" cy="57" r=".9" fill="#6b4b2c" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f3d32"/>
      <stop offset=".4" stop-color="#77241f"/>
      <stop offset=".72" stop-color="#541a1b"/>
      <stop offset="1" stop-color="#a44b3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#paper)"/>
  <rect width="1200" height="900" fill="url(#edge)"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".45"/>
  <rect width="1200" height="900" fill="url(#fibres)"/>
  <g fill="none" stroke="#765532" stroke-opacity=".2">
