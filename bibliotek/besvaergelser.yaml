# Besværgelser og regelkort om magi. Hvert kort har et id (nøglen), som kortbunker henviser til.
# Felt-reference: docs/kort-yaml.md (afsnittet 'Nyt kort i biblioteket').

eldritch-blast:
  navn: Eldritch Blast
  dansk: Overjordisk stråle
  grad: 0
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Action
  afstand: 120 ft
  varighed: Øjeblikkelig
  komp: V, S
  effekt: En stråle af knitrende energi skyder mod et væsen inden for rækkevidde.
  terningboks:
  - [Angreb, d20 + spellangreb, afstand]
  - [Skade, 1d10, Force pr. stråle]
  skala:
  - [Level 1, 1 stråle]
  - ['5', '2']
  - ['11', '3']
  - ['17', '4']
  bag:
  - titel: Sådan virker det
    tekst: Slå et afstands-spellangreb mod målet. Rammer du, tager det 1d10 Force-skade.
  - titel: Flere stråler
    tekst: Fra level 5 skyder du flere stråler. Hver stråle er sit eget angreb med sit eget slag og sin egen skade. De kan ramme samme mål eller forskellige mål.
  - titel: Godt at vide
    punkter:
    - Force-skade er der næsten ingen væsner, der modstår.
    - <i>Agonizing Blast</i> lægger din magi-modifier til skaden fra hver stråle.
    - <i>Hex</i> giver +1d6 for hver stråle, der rammer.
fire-bolt:
  navn: Fire Bolt
  dansk: Ildpil
  grad: 0
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Action
  afstand: 120 ft
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Du kaster en plet ild mod et væsen eller en genstand inden for rækkevidde.
  terningboks:
  - [Angreb, d20 + spellangreb, afstand]
  - [Skade, 1d10, Fire]
  skala:
  - [Level 1, 1d10]
  - ['5', 2d10]
  - ['11', 3d10]
  - ['17', 4d10]
  bag:
  - titel: Sådan virker det
    tekst: Slå et afstands-spellangreb mod målet. Rammer du, tager det 1d10 Fire-skade.
  - titel: Ild antænder
    tekst: En brændbar genstand, som ingen bærer eller holder, bryder i brand, når den bliver ramt.
  - titel: Godt at vide
    punkter:
    - Kan bruges til at tænde bål, fakler og lunter på afstand.
    - Nogle væsner er immune over for Fire-skade, fx ildelementarer og røde drager.
shocking-grasp:
  navn: Shocking Grasp
  dansk: Elektrisk greb
  grad: 0
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Action
  afstand: Berøring
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Lyn springer fra din hånd og giver et væsen, du prøver at røre, et stød.
  terningboks:
  - [Angreb, d20 + spellangreb, nærkamp]
  - [Skade, 1d8, Lightning]
  skala:
  - [Level 1, 1d8]
  - ['5', 2d8]
  - ['11', 3d8]
  - ['17', 4d8]
  bag:
  - titel: Sådan virker det
    tekst: Slå et nærkamps-spellangreb mod målet. Rammer du, tager det 1d8 Lightning-skade.
  - titel: Ingen modangreb
    tekst: Et ramt mål kan ikke lave <i>Opportunity Attacks</i> før starten af sin næste tur.
  - titel: Godt at vide
    punkter:
    - 'Godt til at slippe væk: ram fjenden, og gå derefter væk fra den uden at blive slået.'
    - Du skal stå lige ved siden af målet.
poison-spray:
  navn: Poison Spray
  dansk: Giftsprøjt
  grad: 0
  skole: Necromancy
  skole_da: Nekromanti
  tid: Action
  afstand: 30 ft
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Du sprøjter en giftig tåge mod et væsen inden for rækkevidde.
  terningboks:
  - [Angreb, d20 + spellangreb, afstand]
  - [Skade, 1d12, Poison]
  skala:
  - [Level 1, 1d12]
  - ['5', 2d12]
  - ['11', 3d12]
  - ['17', 4d12]
  bag:
  - titel: Sådan virker det
    tekst: Slå et afstands-spellangreb mod målet. Rammer du, tager det 1d12 Poison-skade.
  - titel: Godt at vide
    punkter:
    - Højeste skadeterning blandt cantrips, men kort rækkevidde.
    - 'Mange væsner er immune over for Poison-skade: udøde, konstruktioner, mange dæmoner og djævle. Skift til en anden besværgelse, hvis skaden ikke virker.'
    - I 2024-reglerne er det et angrebsslag, ikke et redningskast.
minor-illusion:
  navn: Minor Illusion
  dansk: Lille illusion
  grad: 0
  skole: Illusion
  skole_da: Illusion
  tid: Action
  afstand: 30 ft
  varighed: 1 minut
  komp: S, M
  effekt: Skab <b>enten</b> en lyd <b>eller</b> et stillestående billede af en genstand, højst en terning på 5 ft.
  terningboks:
  - [Afslør, Study, 'handling: INT <i>Investigation</i> mod din spell DC']
  bag:
  - titel: Lyd
    tekst: Fra hvisken til skrig. Din stemme, en andens stemme, en løve, trommer. Lyden kan fortsætte eller komme og gå i hele varigheden.
  - titel: Billede
    tekst: Fx en stol, mudrede fodspor eller en lille kiste. Billedet kan ikke lave lyd, lys, lugt eller andet. Rører noget det, går det lige igennem, og illusionen er afsløret.
  - titel: Gennemskuet
    tekst: Et væsen, der gennemskuer illusionen, ser den som svag og gennemsigtig.
  - titel: Materiale
    tekst: Lidt uld <i>a bit of fleece</i>. Kaster du den igen, slutter den gamle.
shape-water:
  navn: Shape Water
  dansk: Form vand
  grad: 0
  skole: Transmutation
  skole_da: Forvandling
  tid: Action
  afstand: 30 ft
  varighed: Øjeblikkelig eller 1 time
  komp: S
  effekt: Du styrer vand, der kan være i en terning på 5 ft. Vælg én af fire effekter, se bagsiden.
  terningboks:
  - [D20 Test, Intet, virker automatisk]
  - [Aktive, Højst 2, 1-times effekter ad gangen]
  bag:
  - titel: Vælg én effekt
    punkter:
    - <b>Flyt:</b> Flyt vandet eller ændr strømmen op til 5 ft. Ikke nok kraft til at skade. <i>Øjeblikkelig.</i>
    - <b>Former:</b> Vandet laver simple former, der bevæger sig. <i>1 time.</i>
    - <b>Farve:</b> Skift vandets farve eller gennemsigtighed. <i>1 time.</i>
    - <b>Frys:</b> Frys vandet, hvis der ikke er væsner i det. <i>1 time.</i>
  - titel: Godt at vide
    tekst: 'Du kan afslutte en effekt med en <i>Magic</i>-handling. Fx: frys en vandpyt til is, eller farv flodvand for at se, om det er rent.'
thaumaturgy:
  navn: Thaumaturgy
  dansk: Mirakelmagi
  grad: 0
  skole: Transmutation
  skole_da: Forvandling
  tid: Action
  afstand: 30 ft
  varighed: Op til 1 minut
  komp: V
  effekt: Du skaber et lille under, et tegn på overnaturlig kraft. Vælg én af seks effekter, se bagsiden.
  terningboks:
  - [D20 Test, Intet, virker automatisk]
  - [Aktive, Højst 3, 1-minuts effekter ad gangen]
  bag:
  - titel: Vælg én effekt
    punkter:
    - <b>Øjne:</b> Dine øjne ændrer udseende i 1 minut.
    - <b>Brølende stemme:</b> Din stemme er 3 gange højere i 1 minut.
    - <b>Ildleg:</b> Flammer flimrer, lyser op, dæmpes eller skifter farve i 1 minut.
    - <b>Usynlig hånd:</b> En ulåst dør eller et vindue flyver op eller smækker i.
    - '<b>Spøgelseslyd:</b> En lyd et sted i rækkevidden: torden, en ravn, uhyggelig hvisken.'
    - <b>Rystelser:</b> Jorden ryster svagt i 1 minut.
  - titel: Godt at vide
    tekst: God sammen med <i>Intimidation</i>. Spørg DM'en, om det giver fordel.
guidance:
  navn: Guidance
  dansk: Vejledning
  grad: 0
  skole: Divination
  skole_da: Spådom
  tid: Action
  afstand: Berøring
  varighed: Koncentration, op til 1 minut
  komp: V, S
  konc: true
  effekt: Rør et villigt væsen, og vælg en skill. Indtil besværgelsen slutter, lægger væsnet <b>1d4</b> til sine checks med den skill.
  terningboks:
  - [Bonus, +1d4, på checks med den valgte skill]
  bag:
  - titel: Sådan virker det
    tekst: Væsnet lægger 1d4 til hvert ability check med den valgte skill, så længe besværgelsen varer. Du kan vælge dig selv.
  - titel: Godt at vide
    punkter:
    - Skal kastes <b>før</b> slaget, fx før en forhandling, et låsedirk eller en klatretur.
    - Kræver koncentration. Du kan ikke holde <i>Hex</i> eller <i>Witch Bolt</i> samtidig.
    - Virker ikke på angreb eller redningskast.
spare-the-dying:
  navn: Spare the Dying
  dansk: Skån den døende
  grad: 0
  skole: Necromancy
  skole_da: Nekromanti
  tid: Action
  afstand: 15 ft
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Vælg et væsen inden for rækkevidde, der har 0 HP og ikke er dødt. Væsnet bliver <b>stabilt</b> <i>Stable</i>.
  terningboks:
  - [D20 Test, Intet, virker automatisk]
  skala:
  - [Level 1, 15 ft]
  - ['5', '30']
  - ['11', '60']
  - ['17', '120']
  skala_titel: Rækkevidde
  bag:
  - titel: Stabil betyder
    punkter:
    - Væsnet slår ikke flere dødsslag <i>Death Saves</i>.
    - Det er stadig bevidstløst på 0 HP.
    - Det får 1 HP efter 1d4 timer, hvis ingen heler det før.
  - titel: Godt at vide
    tekst: Virker på afstand, så du ikke selv skal løbe ind i kampen. Tager væsnet skade igen, slår det dødsslag igen.
hex:
  navn: Hex
  dansk: Forbandelse
  grad: 1
  skole: Enchantment
  skole_da: Fortryllelse
  tid: Bonus Action
  afstand: 90 ft
  varighed: Koncentration, op til 1 time
  komp: V, S, M
  konc: true
  effekt: Forband et væsen, du kan se. Du giver ekstra skade, når du rammer det.
  terningboks:
  - [Ekstra, +1d6, Necrotic hver gang du rammer]
  - [Ulempe, Checks, med den valgte evne]
  skala:
  - [1. grad, 1 time]
  - ['2.', 4 timer]
  - [3.–4., 8 timer]
  - [5.+, 24 timer]
  skala_titel: Varighed
  bag:
  - titel: Flyt forbandelsen
    tekst: Falder målet til 0 HP, før besværgelsen slutter, kan du bruge en Bonus Action på en senere tur til at forbande et nyt væsen.
  - titel: Godt at vide
    punkter:
    - Gælder alle angreb, også hver stråle af <i>Eldritch Blast</i>.
    - 'Vælg evnen med omtanke: STR mod en, der prøver at bryde fri, WIS mod en, der skal opdage dig.'
    - Kræver koncentration.
  - {titel: Materiale, tekst: Et forstenet salamanderøje <i>petrified eye of a newt</i>.}
armor-of-agathys:
  navn: Armor of Agathys
  dansk: Agathys' rustning
  grad: 1
  skole: Abjuration
  skole_da: Beskyttelse
  tid: Bonus Action
  afstand: Dig selv
  varighed: 1 time
  komp: V, S, M
  effekt: Frost dækker dig. Du får midlertidige HP. Rammer et væsen dig med et nærkampsangreb, tager det Cold-skade.
  terningboks:
  - [Midl. HP, '5', midlertidige HP]
  - [Cold, '5', 'til den, der rammer dig i nærkamp']
  skala:
  - [1. grad, '5']
  - ['2.', '10']
  - ['3.', '15']
  - ['4.', '20']
  skala_titel: HP og Cold
  bag:
  - titel: Sådan virker det
    tekst: Cold-skaden virker kun, så længe du stadig har nogle af de midlertidige HP tilbage.
  - titel: Godt at vide
    punkter:
    - Midlertidige HP lægges ikke sammen med andre midlertidige HP. Du beholder den største pulje.
    - Kræver ikke koncentration, så du kan bruge den sammen med <i>Hex</i>.
    - Kast den, før kampen starter, hvis du kan.
  - {titel: Materiale, tekst: Et stykke blåt glas <i>a shard of blue glass</i>.}
witch-bolt:
  navn: Witch Bolt
  dansk: Heksestråle
  grad: 1
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Action
  afstand: 60 ft
  varighed: Koncentration, op til 1 minut
  komp: V, S, M
  konc: true
  effekt: En lynbue binder dig til målet. Du kan give det stød igen og igen.
  terningboks:
  - [Angreb, d20 + spellangreb, afstand]
  - [Skade, 2d12, 'Lightning · senere ture: 1d12 (Bonus Action)']
  skala:
  - [1. grad, 2d12]
  - ['2.', 3d12]
  - ['3.', 4d12]
  - ['4.', 5d12]
  skala_titel: Første skade
  bag:
  - titel: Sådan virker det
    tekst: Slå et afstands-spellangreb. Rammer du, tager målet 2d12 Lightning-skade. På hver af dine senere ture kan du bruge en Bonus Action til at give 1d12 Lightning-skade automatisk, <b>også selvom det første angreb missede</b>.
  - titel: Slutter når
    punkter:
    - målet er længere væk end 60 ft,
    - målet har fuld dækning <i>Total Cover</i> fra dig,
    - eller du mister koncentrationen.
  - {titel: Materiale, tekst: 'En kvist, der er ramt af lyn.'}
cure-wounds:
  navn: Cure Wounds
  dansk: Hel sår
  grad: 1
  skole: Abjuration
  skole_da: Beskyttelse
  tid: Action
  afstand: Berøring
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Et væsen, du rører, får HP tilbage.
  terningboks:
  - [Heler, 2d8 + magi-mod, HP tilbage]
  skala:
  - [1. grad, 2d8]
  - ['2.', 4d8]
  - ['3.', 6d8]
  - ['4.', 8d8]
  skala_titel: Helbredelse
  bag:
  - titel: Sådan virker det
    tekst: Væsnet får 2d8 + din magi-modifier HP tilbage. Det kan ikke få flere HP end sit maksimum.
  - titel: Godt at vide
    punkter:
    - Et væsen på 0 HP vågner med det samme.
    - Magi-modifier er den evne, du kaster besværgelsen med.
    - Du skal stå ved siden af. Kan du ikke nå frem, så brug <i>Spare the Dying</i>.
detect-magic:
  navn: Detect Magic
  dansk: Spor magi
  grad: 1
  skole: Divination
  skole_da: Spådom
  tid: Action
  afstand: Dig selv
  varighed: Koncentration, op til 10 minutter
  komp: V, S
  konc: true
  ritual: true
  effekt: Du mærker, om der er magi inden for 30 ft af dig.
  terningboks:
  - [Område, 30 ft, omkring dig]
  - [Ritual, +10 min, intet spell slot]
  bag:
  - titel: Se auraen
    tekst: Mærker du magi, kan du bruge en <i>Magic</i>-handling til at se en svag aura omkring et synligt væsen eller en genstand med magi. Er det en besværgelse, lærer du dens skole.
  - titel: Blokeres af
    tekst: 1 ft sten, jord eller træ, 1 tomme metal, eller et tyndt lag bly.
  - titel: Ritual
    tekst: Tager 10 minutter længere at kaste, men bruger intet spell slot. Godt til at undersøge genstande, døre og kister.
comprehend-languages:
  navn: Comprehend Languages
  dansk: Forstå sprog
  grad: 1
  skole: Divination
  skole_da: Spådom
  tid: Action
  afstand: Dig selv
  varighed: 1 time
  komp: V, S, M
  ritual: true
  effekt: Du forstår den bogstavelige betydning af ethvert sprog, du hører eller ser tegnet.
  terningboks:
  - [Læse, 1 side / min., du skal røre skriften]
  - [Ritual, +10 min, intet spell slot]
  bag:
  - titel: Skrift
    tekst: Du forstår også skrift, når du rører overfladen, den står på. Det tager cirka 1 minut at læse én side.
  - titel: Virker ikke på
    tekst: Hemmelige beskeder i en tekst og symboler eller glyffer, der ikke er en del af et skriftsprog, fx magiske tegn.
  - {titel: Ritual, tekst: 'Tager 10 minutter længere at kaste, men bruger intet spell slot.'}
  - {titel: Materiale, tekst: En knivspids sod og salt.}
regel-slots:
  type: regel
  navn: Cantrips og spell slots
  dansk: Regelkort
  effekt: ''
  foran:
  - titel: Cantrip <i>grad 0</i>
    tekst: Bruger <b>intet</b> spell slot. Kan kastes igen og igen, én gang pr. handling. Bliver stærkere af sig selv på level 5, 11 og 17.
  - titel: Spell slot <i>grad 1+</i>
    tekst: 'Hvert kast af en besværgelse på 1. grad eller højere bruger ét slot. Ingen slots tilbage: ingen kast før et hvil.'
  - titel: Højere slot
    tekst: Du kan bruge et højere slot. Mange besværgelser bliver stærkere, se tabellen på kortet.
  bag:
  - titel: Hvornår kommer de igen?
    punkter:
    - '<b>Warlock</b> <i>Pact Magic</i>: alle slots igen ved <b>kort hvil</b> (1 time). Alle slots har samme grad.'
    - '<b>De fleste andre klasser</b>: slots igen ved <b>langt hvil</b> (8 timer).'
  - titel: Én besværgelse pr. tur
    tekst: Bruger du et spell slot på en besværgelse, kan du ikke bruge et andet slot i samme tur. En cantrip med din handling er stadig i orden.
  - titel: Spell-angreb og DC
    punkter:
    - <b>Spellangreb</b> = d20 + magi-evne + PB
    - <b>Spell save DC</b> = 8 + magi-evne + PB
    - Magi-evnen står på dit karakterark.
regel-konc:
  type: regel
  navn: Koncentration og ritualer
  dansk: Regelkort
  foran:
  - titel: Koncentration <span class="ico-k"></span>
    tekst: Du kan kun holde <b>én</b> besværgelse med koncentration ad gangen. Starter du en ny, slutter den gamle.
  - titel: Tager du skade
    tekst: Slå CON-redningskast. DC er 10 eller halvdelen af skaden, det højeste (højst 30). Fejler du, slutter besværgelsen.
  - titel: Ritual Ⓡ
    tekst: Tager 10 minutter ekstra at kaste, men bruger <b>intet</b> spell slot.
  bag:
  - titel: Koncentration slutter også når
    punkter:
    - du bliver <i>Incapacitated</i> eller dør,
    - du selv vælger at stoppe (koster ingen handling).
  - titel: Komponenter
    punkter:
    - '<b>V</b> verbal: du skal kunne tale.'
    - '<b>S</b> somatisk: du skal have en fri hånd til bevægelser.'
    - '<b>M</b> materiale: en lille ting, se bagsiden af kortet. En fokus eller komponentpose kan erstatte den, hvis den ikke har en pris.'
  - titel: Hvilke kan være ritual?
    tekst: Kun ritualer, der står med Ⓡ, kan kastes som ritual.

sacred-flame:
  navn: Sacred Flame
  dansk: Hellig ild
  grad: 0
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Action
  afstand: 60 ft
  varighed: Øjeblikkelig
  komp: V, S
  effekt: Et væsen, du kan se inden for 60 ft, laver en DEX-redningskast. Fejler det, tager det 1d8 Radiant-skade.
  terningboks:
  - [Skade, 1d8, Radiant]
  - [Redning, DEX, mod målet]
  skala:
  - [Level 1, 1d8]
  - ['5', 2d8]
  - ['11', 3d8]
  - ['17', 4d8]
  skala_titel: Skade efter level
  bag:
  - titel: Sådan virker det
    tekst: Målet laver en DEX-redningskast. Fejler det, tager det 1d8 Radiant-skade. Dæksel giver ikke bonus på redningskastet.
  - titel: Godt at vide
    punkter:
    - Intet angrebsslag, så den rammer også gennem dæksel.
    - Skaden stiger ved level 5, 11 og 17.

bless:
  navn: Bless
  dansk: Velsignelse
  grad: 1
  skole: Enchantment
  skole_da: Fortryllelse
  tid: Action
  afstand: 30 ft
  varighed: Koncentration, op til 1 minut
  komp: V, S, M
  konc: true
  effekt: Op til tre væsner du vælger lægger 1d4 til deres angrebsslag og redningskast.
  terningboks:
  - [Bonus, +1d4, angreb og redningskast]
  - [Mål, 3, væsner]
  skala:
  - [1. grad, 3 væsner]
  - ['2.', 4 væsner]
  - ['3.', 5 væsner]
  skala_titel: Væsner efter grad
  bag:
  - titel: Sådan virker det
    tekst: Hvert valgt væsen lægger 1d4 til hvert angrebsslag og hvert redningskast, så længe besværgelsen varer.
  - titel: Godt at vide
    punkter:
    - Materiale: en hellig symbol til mindst 5 gp.
    - Kræver koncentration. Du kan vælge dig selv.
    - Hver grad over 1. giver ét væsen mere.

healing-word:
  navn: Healing Word
  dansk: Helende ord
  grad: 1
  skole: Evocation
  skole_da: Fremkaldelse
  tid: Bonus Action
  afstand: 60 ft
  varighed: Øjeblikkelig
  komp: V
  effekt: Et væsen, du kan se inden for 60 ft, får HP tilbage. Helbredelsen er 2d4 + magi-mod.
  terningboks:
  - [Heler, 2d4 + magi-mod, HP tilbage]
  - [Mål, 60 ft, væsen du kan se]
  skala:
  - [1. grad, 2d4]
  - ['2.', 4d4]
  - ['3.', 6d4]
  - ['4.', 8d4]
  skala_titel: Helbredelse
  bag:
  - titel: Sådan virker det
    tekst: Væsnet får 2d4 + din magi-modifier HP tilbage. Det kan ikke få flere HP end sit maksimum.
  - titel: Godt at vide
    punkter:
    - Bonus Action, så du kan heale i en kamp uden at bruge din Action.
    - Hver grad over 1. giver +2d4 HP.
    - Du skal kunne se det væsen, du heler.

