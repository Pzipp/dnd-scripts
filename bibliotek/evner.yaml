  effekt: Du kan bruge 3 håndværksværktøjer, får rabat på udstyr og kan lave simple ting, når du hviler.
  terningboks:
  - [Rabat, 20 %, på ikke-magisk udstyr]
  bag:
  - titel: Tre dele
    punkter:
    - '<b>Værktøj</b>: du er trænet i 3 slags håndværksværktøj <i>Artisan''s Tools</i>.'
    - '<b>Rabat</b>: 20 % rabat, når du køber ikke-magisk udstyr.'
    - '<b>Hurtigt håndværk</b>: efter et langt hvil kan du lave én ting med et værktøj, du har. Den holder til næste lange hvil.'
  - titel: Eksempler
    tekst: 'Tømrerværktøj: stige eller fakkel. Træskærerværktøj: kølle eller stav. Spørg DM''en, hvad du kan lave.'
