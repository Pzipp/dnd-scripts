crafter:
  type: feat
  navn: Crafter
  dansk: Håndværker
  kicker: Origin feat · <i>fx menneske (Versatile)</i>
  felter:
  - [Tid, Køb og langt hvil]
  - [Brug, Altid]
  - [Kræver, Håndværksværktøj]
