# Klasseevner, Weapon Mastery, feats, art-træk og regelkort.
# Felt-reference: docs/kort-yaml.md (afsnittet 'Nyt kort i biblioteket').

sneak-attack:
  type: klasse
  navn: Sneak Attack
  dansk: Snigangreb
  kicker: Klasseevne · Rogue <i>level 1</i>
  felter:
  - [Tid, Når du rammer]
  - [Brug, 1 gang pr. tur]
  - [Våben, Finesse eller afstand]
  - [Kræver, Fordel eller en ven ved målet]
  effekt: Rammer du et væsen med et angreb, giver du ekstra skade. Du skal have <b>fordel</b>, <b>eller</b> en ven skal stå ved siden af målet.
  terningboks:
  - [Ekstra skade, +1d6, samme type som våbnet]
  skala:
  - [Level 1, 1d6]
  - ['3', 2d6]
  - ['5', 3d6]
  - ['7', 4d6]
  - ['9', 5d6]
  skala_titel: Ekstra skade efter level
  bag:
  - titel: Du skal opfylde én af to
    punkter:
    - Du har <b>fordel</b> <i>Advantage</i> på angrebet.
    - '<b>Eller</b>: en anden fjende af målet står inden for 5 ft af det, er ikke <i>Incapacitated</i>, og du har ikke ulempe.'
  - titel: Våbnet
    tekst: Skal have <i>Finesse</i> (fx dolk, kortsværd) eller være et afstandsvåben (fx bue, armbrøst). Ikke ubevæbnet.
  - titel: Godt at vide
    punkter:
    - Kun én gang pr. tur, men den må gerne komme på et senere angreb, hvis det første misser.
    - Ved kritisk træf slår du også snigangrebets terninger dobbelt.
    - 'Skaden stiger med +1d6 på hvert ulige level: 11: 6d6 · 13: 7d6 · 15: 8d6 · 17: 9d6 · 19: 10d6.'
cunning-action:
  type: klasse
  navn: Cunning Action
  dansk: Snu handling
  kicker: Klasseevne · Rogue <i>level 2</i>
  felter:
  - [Tid, Bonus Action]
  - [Brug, Hver tur]
  - [Kræver, Intet]
  - [Varighed, Øjeblikkelig]
  effekt: 'Brug din Bonus Action på én af tre handlinger: <b>Dash</b>, <b>Disengage</b> eller <b>Hide</b>.'
  terningboks:
  - [Dash, +fart, ekstra bevægelse lig din fart]
  - [Disengage, Fri, ingen modangreb resten af turen]
  - [Hide, Stealth, mod DC 15]
  bag:
  - titel: De tre valg
    punkter:
    - '<b>Dash</b>: Du får ekstra bevægelse lig din fart denne tur.'
    - '<b>Disengage</b>: Du kan gå væk fra fjender uden at de får <i>Opportunity Attacks</i>.'
    - '<b>Hide</b>: Slå Stealth mod DC 15. Du skal være dækket (<i>Heavily Obscured</i> eller ¾ dækning) og ude af fjendens syn. Lykkes det, er du <i>Invisible</i>, og dit resultat er DC for at finde dig.'
  - titel: Godt at vide
    tekst: Usynlig giver fordel på dit næste angreb, og fordel giver <i>Sneak Attack</i>. Angriber du, er du ikke længere skjult.
thieves-cant:
  type: klasse
  navn: Thieves' Cant
  dansk: Tyvesprog
  kicker: Klasseevne · Rogue <i>level 1</i>
  felter:
  - [Tid, Altid]
  - [Brug, Ubegrænset]
  - [Hvem, 'Rogues, tyvebander']
  - [Type, Sprog]
  effekt: 'Du kender tyvenes hemmelige sprog: en blanding af slang, koder og tegn, som andre ikke forstår.'
  terningboks:
  - [D20 Test, Intet, du kan det bare]
  bag:
  - titel: Sådan bruges det
    punkter:
    - Gem en hemmelig besked i en almindelig samtale.
    - 'Læs og lav hemmelige tegn på mure og døre: "farligt", "vagter her", "god at stjæle fra".'
    - Find andre fra tyvenes verden i en ny by.
  - titel: Godt at vide
    tekst: Spørg DM'en, hvem i området der kan tyvesprog. Det er en god måde at finde hjælp eller information på.
light-to-vaaben:
  type: regel
  navn: To våben
  dansk: Light-reglen
  kicker: Våbenregel · <i>Light</i>
  foran:
  - titel: Ekstra angreb
    tekst: Tager du <i>Attack</i>-handlingen og angriber med et <i>Light</i>-våben, må du lave <b>ét</b> ekstra angreb med et <b>andet</b> Light-våben i samme tur.
  - titel: Hvornår
    tekst: Normalt som <b>Bonus Action</b>. Med <i>Nick</i> laves det som en del af Attack-handlingen, så Bonus Action er fri.
  - titel: Skade
    tekst: Ekstraangrebet får <b>ikke</b> din evne-modifier på skaden (medmindre den er negativ).
  bag:
  - titel: Light-våben
    tekst: Dolk <i>Dagger</i>, kortsværd <i>Shortsword</i>, sabel <i>Scimitar</i>, håndøkse <i>Handaxe</i>, let hammer, kølle, segl.
  - titel: Gør det stærkere
    punkter:
    - '<b>Nick</b> (mastery): ekstraangrebet bruger ikke din Bonus Action.'
    - '<b>Two-Weapon Fighting</b> (fighting style): ekstraangrebet får din evne-modifier på skaden.'
  - titel: Godt at vide
    tekst: Du kan kaste det andet våben, hvis det har <i>Thrown</i>, fx en dolk.
vex:
  type: mastery
  navn: Vex
  dansk: Drille
  kicker: Weapon Mastery · <i>fx Shortbow, Handaxe</i>
  felter:
  - [Tid, Når du rammer]
  - [Brug, Hvert træf]
  - [Kræver, Du gør skade]
  - [Varighed, Til slut på din næste tur]
  effekt: Rammer du et væsen og gør skade, får du <b>fordel</b> på dit næste angreb mod <b>samme</b> væsen.
  terningboks:
  - [Næste angreb, Fordel, '2 d20, tag den højeste']
  bag:
  - titel: Sådan virker det
    tekst: Fordelen gælder dit næste angrebsslag mod det samme væsen, før din næste tur slutter.
  - titel: Godt at vide
    punkter:
    - Fordel giver <i>Sneak Attack</i>. Ram én gang, og næste angreb kan give snigangreb.
    - Bruger du fordelen på et andet mål, forsvinder den ikke, men den virker kun mod det første.
  - titel: Weapon Mastery
    tekst: Du kan kun bruge egenskaben med våben, du har valgt mastery i. Valgene kan byttes ved Long Rest.
nick:
  type: mastery
  navn: Nick
  dansk: Hurtigt snit
  kicker: Weapon Mastery · <i>fx Dagger, Scimitar</i>
  felter:
  - [Tid, Attack-handling]
  - [Brug, 1 gang pr. tur]
  - [Kræver, To Light-våben]
  - [Varighed, Øjeblikkelig]
  effekt: Det ekstra angreb fra <i>Light</i>-reglen laves som en del af din <b>Attack</b>-handling i stedet for som Bonus Action.
  terningboks:
  - [Ekstra angreb, d20 + angreb, skade uden evne-modifier]
  bag:
  - titel: Sådan virker det
    tekst: Du angriber med det ene Light-våben og laver straks ekstraangrebet med det andet. Din Bonus Action er stadig fri.
  - titel: Brug Bonus Action til
    punkter: ['<i>Cunning Action</i>: Disengage og smut væk.', <i>Second Wind</i> eller <i>Rage</i>.]
  - titel: Godt at vide
    tekst: Nick skal sidde på det våben, du laver ekstraangrebet med. Se også kortet <i>To våben</i>.
graze:
  type: mastery
  navn: Graze
  dansk: Strejf
  kicker: Weapon Mastery · <i>fx Greatsword, Glaive</i>
  felter:
  - [Tid, Når du misser]
  - [Brug, Hver miss]
  - [Kræver, Nærkamp med våbnet]
  - [Varighed, Øjeblikkelig]
  effekt: Misser du et væsen, tager det alligevel skade lig den evne-modifier, du angreb med.
  terningboks:
  - [Skade ved miss, evne-mod, samme skadetype som våbnet]
  bag:
  - titel: Sådan virker det
    tekst: Angriber du med STR +3 og misser, tager målet stadig 3 skade. Skaden kan kun blive større, hvis modifieren bliver større.
  - titel: Godt at vide
    punkter:
    - Gør aldrig 0 i en tur, hvor du angriber, så længe modifieren er positiv.
    - Ingen terninger, så <i>Savage Attacker</i> og kritiske træf ændrer ikke på det.
slow:
  type: mastery
  navn: Slow
  dansk: Sænk farten
  kicker: Weapon Mastery · <i>fx Sling, Club, Longbow</i>
  felter:
  - [Tid, Når du rammer]
  - [Brug, Hvert træf]
  - [Kræver, Du gør skade]
  - [Varighed, Til start af din næste tur]
  effekt: Rammer du et væsen og gør skade, falder dets fart med <b>10 ft</b>.
  terningboks:
  - [Fart, −10 ft, til starten af din næste tur]
  bag:
  - titel: Sådan virker det
    tekst: Rammer du det flere gange, falder farten stadig kun 10 ft i alt.
  - titel: Godt at vide
    punkter:
    - God mod fjender, der vil løbe hen til jeres svageste, eller som prøver at flygte.
    - Med en slangebøsse kan du bremse fjender på afstand.
cleave:
  type: mastery
  navn: Cleave
  dansk: Kløve
  kicker: Weapon Mastery · <i>fx Greataxe, Halberd</i>
  felter:
  - [Tid, Når du rammer]
  - [Brug, 1 gang pr. tur]
  - [Kræver, En fjende mere tæt på]
  - [Varighed, Øjeblikkelig]
  effekt: Rammer du en fjende i nærkamp, må du hugge én gang mere mod en <b>anden</b> fjende lige ved siden af den første.
  terningboks:
  - [Ekstra hug, d20 + angreb, mod fjende nr. 2]
  - [Skade, Våbnets terning, uden evne-modifier]
  bag:
  - titel: Sådan virker det
    tekst: Fjende nr. 2 skal stå inden for 5 ft af den første og inden for din rækkevidde. Slå et nyt angreb. Rammer du, gør du våbnets skade, men lægger ikke din evne-modifier til.
  - titel: Godt at vide
    punkter: [<i>Rage</i>-bonussen (+2) gælder stadig på det ekstra hug., Kun én gang pr. tur.]
second-wind:
  type: klasse
  navn: Second Wind
  dansk: Andet pust
  kicker: Klasseevne · Fighter <i>level 1</i>
  felter:
  - [Tid, Bonus Action]
  - [Brug, Se tabel]
  - [Tilbage, '1 ved kort hvil, alle ved langt']
  - [Varighed, Øjeblikkelig]
  effekt: Du tager en dyb indånding og får HP tilbage.
  terningboks:
  - [Helbredelse, 1d10 + level, Fighter-level]
  skala:
  - [Level 1, '2']
  - ['4', '3']
  - ['10', '4']
  skala_titel: Antal brug
  bag:
  - titel: Sådan virker det
    tekst: Brug din Bonus Action. Slå 1d10 og læg dit Fighter-level til. Du får så mange HP tilbage.
  - titel: Brug kommer igen
    punkter: ['<b>Kort hvil</b>: 1 brug kommer igen.', '<b>Langt hvil</b>: alle brug kommer igen.']
  - titel: Godt at vide
    tekst: 'Kan også bruges til <i>Tactical Mind</i> (level 2): +1d10 på et mislykket evnetjek.'
action-surge:
  type: klasse
  navn: Action Surge
  dansk: Kampbølge
  kicker: Klasseevne · Fighter <i>level 2</i>
  felter:
  - [Tid, På din tur]
  - [Brug, 1 gang]
  - [Tilbage, Kort eller langt hvil]
  - [Varighed, Øjeblikkelig]
  effekt: Du får <b>én ekstra handling</b> på din tur.
  terningboks:
  - [Ekstra, 1 handling, ikke Magic-handlingen]
  skala:
  - [Level 2, 1 brug]
  - ['17', 2 brug]
  skala_titel: Antal brug
  bag:
  - titel: Sådan virker det
    tekst: Du får en ekstra handling ud over din normale handling og Bonus Action. Den kan være Attack, Dash, Disengage, Help, Hide og så videre, men ikke <i>Magic</i>.
  - titel: Godt at vide
    punkter:
    - 'To Attack-handlinger i samme tur: brug den, når du skal fælde en stor fjende hurtigt.'
    - Med 2 brug (level 17) kan du stadig kun bruge én pr. tur.
    - Kommer igen ved kort hvil, så brug den gerne i hver kamp.
tactical-mind:
  type: klasse
  navn: Tactical Mind
  dansk: Taktisk sans
  kicker: Klasseevne · Fighter <i>level 2</i>
  felter:
  - [Tid, Når et evnetjek fejler]
  - [Brug, 1 Second Wind]
  - [Kræver, Et brug tilbage]
  - [Varighed, Øjeblikkelig]
  effekt: Fejler du et evnetjek, kan du bruge et <b>Second Wind</b> til at lægge <b>1d10</b> til slaget i stedet for at hele.
  terningboks:
  - [Bonus, +1d10, på det mislykkede tjek]
  bag:
  - titel: Sådan virker det
    tekst: Slå 1d10 og læg det til det tjek, der fejlede. Måske lykkes det så.
  - {titel: Fejler det stadig, tekst: Så er Second Wind <b>ikke</b> brugt. Du mister intet.}
  - titel: Godt at vide
    tekst: Gælder kun evnetjek (fx Athletics, Perception), ikke angreb eller redningskast.
two-weapon-fighting:
  type: klasse
  navn: Two-Weapon Fighting
  dansk: Kamp med to våben
  kicker: Fighting Style · Fighter
  felter:
  - [Tid, Light-ekstraangreb]
  - [Brug, Hver gang]
  - [Kræver, To Light-våben]
  - [Varighed, Altid]
  effekt: Når du laver det ekstra angreb fra <i>Light</i>-reglen, lægger du din evne-modifier til skaden.
  terningboks:
  - [Ekstra angreb, + evne-mod, på skaden]
  bag:
  - titel: Sådan virker det
    tekst: Normalt får ekstraangrebet ingen evne-modifier på skaden. Med denne fighting style får det fuld skade som et almindeligt angreb.
  - titel: Godt sammen med
    punkter: ['<i>Nick</i>: ekstraangrebet bruger ikke Bonus Action.', Se også kortet <i>To våben</i>.]
savage-attacker:
  type: feat
  navn: Savage Attacker
  dansk: Vild angriber
  kicker: Origin feat · <i>fx fra Soldier</i>
  felter:
  - [Tid, Når du rammer]
  - [Brug, 1 gang pr. tur]
  - [Kræver, Et våben]
  - [Varighed, Øjeblikkelig]
  effekt: Rammer du med et våben, må du slå våbnets skadeterninger <b>to gange</b> og bruge det bedste.
  terningboks:
  - [Skade, 2 × slag, brug det højeste]
  bag:
  - titel: Sådan virker det
    tekst: Slå kun våbnets egne terninger to gange (fx 2d6 for et greatsword). Modifiers lægges til bagefter.
  - titel: Godt at vide
    punkter:
    - Bestem dig, efter du har ramt. Brug det på det angreb med de største terninger.
    - Gælder ikke ekstra terninger fra andre ting, fx <i>Sneak Attack</i>.
alert:
  type: feat
  navn: Alert
  dansk: Årvågen
  kicker: Origin feat · <i>fx fra Criminal</i>
  felter:
  - [Tid, Initiativ]
  - [Brug, Hver kamp]
  - [Kræver, Intet]
  - [Varighed, Altid]
  effekt: Du lægger din <b>proficiency bonus</b> til initiativ. Lige efter initiativ må du <b>bytte</b> initiativ med en villig ven.
  terningboks:
  - [Initiativ, d20 + DEX + PB, PB er allerede regnet med på arket]
  bag:
  - titel: Byt initiativ
    tekst: Lige efter alle har slået initiativ, må du bytte dit tal med en villig ven i samme kamp. Ingen af jer må være <i>Incapacitated</i>.
  - titel: Godt at vide
    punkter:
    - Byt med en healer, der skal nå frem først, eller med en, der kan gøre fjenderne svagere.
    - Højt initiativ betyder, at du ofte handler før fjenderne.
lucky:
  type: feat
  navn: Lucky
  dansk: Heldig
  kicker: Origin feat · <i>fx fra Wayfarer</i>
  felter:
  - [Tid, Når en d20 slås]
  - [Brug, Lykkepoint = PB]
  - [Tilbage, Langt hvil]
  - [Varighed, Øjeblikkelig]
  effekt: Du har lykkepoint lig din proficiency bonus. Brug ét til at give dig selv <b>fordel</b> eller en fjende <b>ulempe</b>.
  terningboks:
  - [Dig selv, Fordel, på et D20 Test]
  - [Fjende, Ulempe, på et angreb mod dig]
  skala:
  - [Level 1, '2']
  - ['5', '3']
  - ['9', '4']
  - ['13', '5']
  - ['17', '6']
  skala_titel: Lykkepoint
  bag:
  - titel: Sådan virker det
    punkter:
    - '<b>Fordel</b>: når du slår en d20 (angreb, tjek eller redningskast), bruger du 1 point og får fordel.'
    - '<b>Ulempe</b>: når et væsen slår angreb mod dig, bruger du 1 point og giver det ulempe.'
  - titel: Godt at vide
    tekst: Alle point kommer igen ved langt hvil. Fordel giver også <i>Sneak Attack</i>.
heroic-inspiration:
  type: regel
  navn: Heroic Inspiration
  dansk: Heltemod
  kicker: Regel · <i>fx Resourceful (menneske)</i>
  foran:
  - titel: Har du den
    tekst: Du må slå <b>én terning om</b> lige efter, du har slået den. Du skal bruge det nye slag.
  - titel: Kun én ad gangen
    tekst: Du kan kun have én Heroic Inspiration. Får du en ny, mens du har en, kan du give den til en ven.
  - titel: Menneske · Resourceful
    tekst: Du får Heroic Inspiration, hver gang du er færdig med et <b>langt hvil</b>.
  bag:
  - titel: Godt at vide
    punkter:
    - 'Virker på alle terninger: angreb, skade, tjek, redningskast, dødsslag.'
    - DM'en kan også give den for godt rollespil eller en modig idé.
    - Brug den. Den kommer igen ved næste lange hvil.
darkvision:
  type: art
  navn: Darkvision
  dansk: Mørkesyn
  kicker: Art · <i>fx Tiefling, Felis</i>
  felter:
  - [Tid, Altid]
  - [Rækkevidde, 60 ft]
  - [Kræver, Intet]
  - [Varighed, Altid]
  effekt: Du ser i mørke op til 60 ft, som var det svagt lys, og i svagt lys, som var det fuldt lys.
  terningboks:
  - [Mørke, Svagt lys, kun i gråtoner]
  bag:
  - titel: Sådan virker det
    punkter:
    - Mørke inden for 60 ft er for dig som svagt lys (<i>Lightly Obscured</i>).
    - Du kan ikke se farver i mørke, kun gråtoner.
    - Magisk mørke kan du ikke se igennem.
  - titel: Godt at vide
    tekst: I svagt lys har du ulempe på Perception, der kræver syn. Fjender uden mørkesyn kan ikke se dig i mørket, så du kan gemme dig der.
halfling-luck:
  type: art
  navn: Luck
  dansk: Halfling-held
  kicker: Art · Halfling
  felter:
  - [Tid, Når du slår 1]
  - [Brug, Hver gang]
  - [Gælder, D20 Test]
  - [Varighed, Altid]
  effekt: Slår du <b>1</b> på en d20 til angreb, evnetjek eller redningskast, må du slå om. Du skal bruge det nye slag.
  terningboks:
  - [Natur-1, Slå om, brug det nye slag]
  bag:
  - titel: Gælder
    tekst: 'Alle d20-tests: angreb, evnetjek og redningskast. Ikke skadeterninger.'
  - titel: Godt at vide
    tekst: Virker hver gang, ingen begrænsning. Slår du 1 igen på det nye slag, må du ikke slå om igen.
brave:
  type: art
  navn: Brave
  dansk: Modig
  kicker: Art · Halfling
  felter:
  - [Tid, Redningskast]
  - [Brug, Hver gang]
  - [Gælder, Frightened]
  - [Varighed, Altid]
  effekt: Du har <b>fordel</b> på redningskast mod at blive bange <i>Frightened</i> eller for at slippe fri af det.
  terningboks:
  - [Mod frygt, Fordel, '2 d20, tag den højeste']
  bag:
  - titel: Frightened betyder
    punkter:
    - Ulempe på tjek og angreb, mens du kan se det, du er bange for.
    - Du kan ikke gå tættere på det.
  - titel: Godt at vide
    tekst: Drager, spøgelser og nogle besværgelser prøver at gøre jer bange. Du er sværere at skræmme end de fleste.
halfling-nimbleness:
  type: art
  navn: Halfling Nimbleness
  dansk: Halfling-smidighed
  kicker: Art · Halfling
  felter:
  - [Tid, Når du bevæger dig]
  - [Brug, Hver gang]
  - [Gælder, Større væsner]
  - [Varighed, Altid]
  effekt: Du kan bevæge dig <b>gennem</b> pladsen af ethvert væsen, der er mindst én størrelse større end dig.
  terningboks:
  - [Bevægelse, Igennem, men du må ikke stoppe der]
  bag:
  - titel: Sådan virker det
    tekst: Du er Small, så du kan smutte forbi Medium, Large og større væsner, både venner og fjender. Du må ikke slutte din bevægelse i deres felt.
  - titel: Godt at vide
    tekst: Kom forbi en fjende, der spærrer en gang, eller hen bag den, så en ven står ved siden af målet til <i>Sneak Attack</i>.
naturally-stealthy:
  type: art
  navn: Naturally Stealthy
  dansk: Naturligt snigende
  kicker: Art · Halfling
  felter:
  - [Tid, Hide-handling]
  - [Brug, Hver gang]
  - [Kræver, Et større væsen]
  - [Varighed, Altid]
  effekt: Du må gemme dig <i>Hide</i>, selv når du kun er dækket af et væsen, der er mindst én størrelse større end dig.
  terningboks:
  - [Gem dig, Stealth, mod DC 15]
  bag:
  - titel: Sådan virker det
    tekst: Normalt skal du have ¾ dækning eller være i tæt mørke for at gemme dig. Du kan bare stille dig bag en Medium ven.
  - titel: Godt at vide
    tekst: 'Med <i>Cunning Action</i>: gem dig bag en ven som Bonus Action, skyd med fordel, og få <i>Sneak Attack</i>.'
kattens-held:
  type: art
  navn: Kattens Held
  dansk: Felis
  kilde: Hjemmelavet
  kicker: Art · Felis <i>hjemmelavet</i>
  felter:
  - [Tid, Når du slår 1]
  - [Brug, 1 gang]
  - [Tilbage, Langt hvil]
  - [Gælder, D20 Test]
  effekt: Slår du <b>1</b> på en d20 til angreb, evnetjek eller redningskast, må du slå om. Du skal bruge det nye slag.
  terningboks:
  - [Natur-1, Slå om, 1 gang pr. langt hvil]
  bag:
  - titel: Sådan virker det
    tekst: Når du slår en naturlig 1, kan du vælge at bruge Kattens Held og slå om. Det nye slag gælder, også hvis det er dårligt.
  - {titel: Godt at vide, tekst: Kommer igen ved langt hvil. Gem den til et vigtigt slag.}
